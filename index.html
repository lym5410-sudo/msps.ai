<!DOCTYPE html>
<html lang="zh-Hant">
<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>民生國小 AI 教育工具中心</title>

    <meta
        name="description"
        content="民生國小 AI 教育工具中心，整合學科學習、AI工具、課堂工具與學習遊戲。"
    >

    <style>

        * {
            box-sizing: border-box;
        }

        body {

            margin: 0;

            font-family:
                "Noto Sans TC",
                "Microsoft JhengHei",
                Arial,
                sans-serif;

            background:
                radial-gradient(
                    circle at top left,
                    #dbeafe 0%,
                    transparent 35%
                ),
                radial-gradient(
                    circle at top right,
                    #ede9fe 0%,
                    transparent 35%
                ),
                #f8fafc;

            color: #1e293b;

            min-height: 100vh;
        }


        /* =========================
           Header
        ========================= */

        header {

            position: relative;

            overflow: hidden;

            padding: 45px 20px 70px;

            background:
                linear-gradient(
                    135deg,
                    #312e81,
                    #4f46e5,
                    #7c3aed
                );

            color: white;

            text-align: center;
        }


        header::before,
        header::after {

            content: "";

            position: absolute;

            border-radius: 50%;

            background:
                rgba(255,255,255,0.08);
        }


        header::before {

            width: 300px;
            height: 300px;

            top: -150px;
            left: -80px;
        }


        header::after {

            width: 400px;
            height: 400px;

            right: -150px;
            bottom: -250px;
        }


        .admin-button {

            position: absolute;

            top: 20px;
            right: 20px;

            z-index: 10;

            border: 1px solid
                rgba(255,255,255,0.35);

            background:
                rgba(255,255,255,0.15);

            color: white;

            padding: 9px 15px;

            border-radius: 999px;

            cursor: pointer;

            font-size: 14px;

            font-weight: 700;

            backdrop-filter: blur(8px);

            transition: 0.2s;
        }


        .admin-button:hover {

            background:
                rgba(255,255,255,0.25);

            transform:
                translateY(-2px);
        }


        .hero {

            position: relative;

            z-index: 2;

            max-width: 900px;

            margin: auto;
        }


        .hero-icon {

            font-size: 64px;

            margin-bottom: 10px;
        }


        .hero h1 {

            margin: 0;

            font-size:
                clamp(32px, 6vw, 56px);

            font-weight: 900;

            letter-spacing: 2px;
        }


        .hero p {

            margin: 16px 0 0;

            font-size:
                clamp(16px, 2vw, 21px);

            opacity: 0.9;
        }


        .hero-subtitle {

            margin-top: 8px;

            font-size: 14px;

            opacity: 0.75;
        }


        /* =========================
           Main
        ========================= */

        main {

            max-width: 1200px;

            margin: -35px auto 0;

            padding:
                0 20px 60px;

            position: relative;

            z-index: 5;
        }


        /* =========================
           Search
        ========================= */

        .search-box {

            background: white;

            border-radius: 20px;

            padding: 10px;

            box-shadow:
                0 15px 40px
                rgba(15, 23, 42, 0.12);

            display: flex;

            align-items: center;
        }


        .search-icon {

            font-size: 25px;

            margin:
                0 10px;
        }


        #searchInput {

            border: none;

            outline: none;

            flex: 1;

            font-size: 18px;

            padding: 15px;

            background: transparent;

            color: #1e293b;
        }


        /* =========================
           Filters
        ========================= */

        .filter-area {

            margin-top: 25px;
        }


        .filter-title {

            font-size: 14px;

            font-weight: 800;

            color: #64748b;

            margin-bottom: 10px;
        }


        .categories {

            display: flex;

            gap: 10px;

            overflow-x: auto;

            padding-bottom: 5px;
        }


        .category-btn {

            border: none;

            background: white;

            padding:
                10px 17px;

            border-radius: 999px;

            font-size: 14px;

            font-weight: 700;

            cursor: pointer;

            white-space: nowrap;

            box-shadow:
                0 4px 15px
                rgba(15, 23, 42, 0.08);

            transition: 0.2s;
        }


        .category-btn:hover {

            transform:
                translateY(-2px);
        }


        .category-btn.active {

            background:
                #4f46e5;

            color: white;
        }


        /* =========================
           Section
        ========================= */

        .section-title {

            display: flex;

            justify-content:
                space-between;

            align-items: center;

            margin:
                35px 0 18px;
        }


        .section-title h2 {

            margin: 0;

            font-size: 25px;
        }


        .tool-count {

            color: #64748b;

            font-size: 14px;
        }


        /* =========================
           Cards
        ========================= */

        #toolsContainer {

            display: grid;

            grid-template-columns:
                repeat(
                    auto-fit,
                    minmax(260px, 1fr)
                );

            gap: 20px;
        }


        .tool-card {

            background: white;

            border-radius: 22px;

            padding: 25px;

            box-shadow:
                0 8px 25px
                rgba(15, 23, 42, 0.08);

            border:
                1px solid
                rgba(226,232,240,0.8);

            transition:
                transform 0.25s,
                box-shadow 0.25s;

            display: flex;

            flex-direction: column;

            min-height: 240px;
        }


        .tool-card:hover {

            transform:
                translateY(-6px);

            box-shadow:
                0 18px 40px
                rgba(15, 23, 42, 0.14);
        }


        .tool-icon {

            font-size: 48px;

            margin-bottom: 12px;
        }


        .tool-category {

            color: #6366f1;

            font-size: 13px;

            font-weight: 800;

            margin-bottom: 5px;
        }


        .tool-name {

            font-size: 21px;

            font-weight: 900;

            margin-bottom: 10px;
        }


        .tool-description {

            color: #64748b;

            line-height: 1.6;

            font-size: 14px;

            flex: 1;
        }


        .tool-footer {

            display: flex;

            justify-content:
                space-between;

            align-items: center;

            gap: 10px;

            margin-top: 20px;
        }


        .grade {

            background:
                #f1f5f9;

            padding:
                6px 10px;

            border-radius: 8px;

            font-size: 12px;

            color: #475569;

            white-space: nowrap;
        }


        .tool-link {

            display: inline-flex;

            align-items: center;

            gap: 5px;

            background:
                #4f46e5;

            color: white;

            text-decoration: none;

            padding:
                9px 14px;

            border-radius: 10px;

            font-weight: 700;

            font-size: 13px;

            transition: 0.2s;
        }


        .tool-link:hover {

            background:
                #3730a3;
        }


        /* =========================
           Empty
        ========================= */

        .empty {

            grid-column:
                1 / -1;

            text-align: center;

            padding:
                70px 20px;

            color: #64748b;
        }


        .empty-icon {

            font-size: 60px;

            margin-bottom: 15px;
        }


        /* =========================
           Modal
        ========================= */

        .modal {

            display: none;

            position: fixed;

            inset: 0;

            z-index: 1000;

            background:
                rgba(15,23,42,0.55);

            backdrop-filter:
                blur(5px);

            padding: 20px;

            overflow-y: auto;
        }


        .modal.show {

            display: flex;

            align-items:
                center;

            justify-content:
                center;
        }


        .modal-box {

            background: white;

            width: 100%;

            max-width: 650px;

            border-radius: 24px;

            padding: 30px;

            box-shadow:
                0 30px 80px
                rgba(0,0,0,0.25);

            position: relative;
        }


        .modal-header {

            display: flex;

            justify-content:
                space-between;

            align-items: center;

            margin-bottom: 25px;
        }


        .modal-header h2 {

            margin: 0;

            font-size: 24px;
        }


        .close-button {

            border: none;

            background:
                #f1f5f9;

            width: 38px;

            height: 38px;

            border-radius: 50%;

            cursor: pointer;

            font-size: 20px;

            color: #475569;
        }


        .close-button:hover {

            background:
                #e2e8f0;
        }


        /* =========================
           Login
        ========================= */

        .login-box {

            max-width: 420px;
        }


        .form-group {

            margin-bottom: 18px;
        }


        .form-group label {

            display: block;

            font-weight: 800;

            font-size: 14px;

            margin-bottom: 7px;

            color: #334155;
        }


        .form-group input,
        .form-group select,
        .form-group textarea {

            width: 100%;

            padding:
                12px 14px;

            border:
                1px solid #cbd5e1;

            border-radius: 10px;

            outline: none;

            font-size: 15px;

            font-family: inherit;

            transition: 0.2s;
        }


        .form-group input:focus,
        .form-group select:focus,
        .form-group textarea:focus {

            border-color:
                #6366f1;

            box-shadow:
                0 0 0 3px
                rgba(99,102,241,0.12);
        }


        .form-group textarea {

            min-height: 100px;

            resize: vertical;
        }


        .form-grid {

            display: grid;

            grid-template-columns:
                1fr 1fr;

            gap: 15px;
        }


        .primary-button {

            border: none;

            background:
                #4f46e5;

            color: white;

            padding:
                12px 20px;

            border-radius: 10px;

            font-size: 15px;

            font-weight: 800;

            cursor: pointer;

            transition: 0.2s;
        }


        .primary-button:hover {

            background:
                #3730a3;
        }


        .secondary-button {

            border: none;

            background:
                #f1f5f9;

            color: #475569;

            padding:
                12px 20px;

            border-radius: 10px;

            font-size: 15px;

            font-weight: 700;

            cursor: pointer;
        }


        .danger-button {

            border: none;

            background:
                #fee2e2;

            color: #b91c1c;

            padding:
                8px 12px;

            border-radius: 8px;

            font-size: 13px;

            font-weight: 700;

            cursor: pointer;
        }


        .edit-button {

            border: none;

            background:
                #eef2ff;

            color: #4338ca;

            padding:
                8px 12px;

            border-radius: 8px;

            font-size: 13px;

            font-weight: 700;

            cursor: pointer;
        }


        .form-actions {

            display: flex;

            justify-content:
                flex-end;

            gap: 10px;

            margin-top: 25px;
        }


        /* =========================
           Admin list
        ========================= */

        .admin-list {

            margin-top: 10px;
        }


        .admin-item {

            display: flex;

            align-items: center;

            gap: 12px;

            padding:
                14px 0;

            border-bottom:
                1px solid #e2e8f0;
        }


        .admin-item-icon {

            font-size: 30px;

            width: 45px;

            text-align: center;
        }


        .admin-item-info {

            flex: 1;

            min-width: 0;
        }


        .admin-item-name {

            font-weight: 800;

            margin-bottom: 4px;
        }


        .admin-item-category {

            font-size: 12px;

            color: #64748b;
        }


        .admin-item-actions {

            display: flex;

            gap: 7px;
        }


        .add-button {

            border: none;

            background:
                #4f46e5;

            color: white;

            padding:
                10px 16px;

            border-radius: 10px;

            cursor: pointer;

            font-weight: 800;
        }


        .admin-toolbar {

            display: flex;

            justify-content:
                space-between;

            align-items: center;

            margin-bottom: 15px;

            gap: 10px;
        }


        /* =========================
           Toast
        ========================= */

        .toast {

            position: fixed;

            left: 50%;

            bottom: 30px;

            transform:
                translateX(-50%)
                translateY(100px);

            background:
                #1e293b;

            color: white;

            padding:
                12px 20px;

            border-radius: 999px;

            z-index: 2000;

            opacity: 0;

            transition:
                0.3s;

            pointer-events: none;

            font-size: 14px;

            box-shadow:
                0 10px 30px
                rgba(0,0,0,0.2);
        }


        .toast.show {

            opacity: 1;

            transform:
                translateX(-50%)
                translateY(0);
        }


        /* =========================
           Loading
        ========================= */

        .loading {

            opacity: 0.6;

            pointer-events: none;
        }


        /* =========================
           Footer
        ========================= */

        footer {

            text-align: center;

            padding:
                30px 20px 45px;

            color: #64748b;

            font-size: 13px;
        }


        footer strong {

            color:
                #4f46e5;
        }


        /* =========================
           Mobile
        ========================= */

        @media (max-width: 600px) {

            header {

                padding:
                    45px 18px 70px;
            }


            .admin-button {

                top: 12px;

                right: 12px;

                font-size: 12px;

                padding:
                    8px 12px;
            }


            .hero-icon {

                font-size: 50px;
            }


            main {

                padding-left: 14px;

                padding-right: 14px;
            }


            #toolsContainer {

                grid-template-columns:
                    1fr;
            }


            .tool-card {

                min-height: 220px;
            }


            .form-grid {

                grid-template-columns:
                    1fr;
            }


            .modal-box {

                padding: 22px;
            }


            .admin-item-actions {

                flex-direction:
                    column;
            }

        }

    </style>

</head>


<body>


<header>

    <button
        class="admin-button"
        onclick="openLogin()"
    >
        🔐 管理
    </button>


    <div class="hero">

        <div class="hero-icon">
            🤖
        </div>

        <h1>
            AI 教育工具中心
        </h1>

        <p>
            AI × 教育 × 創意 × 學習
        </p>

        <div class="hero-subtitle">
            民生國小 AI 教育工具平台
        </div>

    </div>

</header>


<main>


    <!-- 搜尋 -->

    <div class="search-box">

        <span class="search-icon">
            🔎
        </span>

        <input
            type="text"
            id="searchInput"
            placeholder="搜尋工具名稱、學習領域或學習階段……"
        >

    </div>


    <!-- 學習領域 -->

    <div class="filter-area">

        <div class="filter-title">
            📚 學習領域
        </div>

        <div
            class="categories"
            id="categoryContainer"
        ></div>

    </div>


    <!-- 學習階段 -->

    <div class="filter-area">

        <div class="filter-title">
            🎓 學習階段
        </div>

        <div
            class="categories"
            id="gradeContainer"
        ></div>

    </div>


    <!-- 工具 -->

    <div class="section-title">

        <h2>
            🧰 學習工具
        </h2>

        <span
            class="tool-count"
            id="toolCount"
        >
            載入中……
        </span>

    </div>


    <div id="toolsContainer">

        <div class="empty">

            <div class="empty-icon">
                ⏳
            </div>

            正在載入工具……

        </div>

    </div>


</main>


<footer>

    <strong>
        民生國小 AI 教育工具中心
    </strong>

    <br>

    AI × 教育 × 創意 × 未來

</footer>



<!-- =========================================
     登入 Modal
========================================= -->

<div
    class="modal"
    id="loginModal"
>

    <div class="modal-box login-box">

        <div class="modal-header">

            <h2>
                🔐 管理者登入
            </h2>

            <button
                class="close-button"
                onclick="closeModal('loginModal')"
            >
                ×
            </button>

        </div>


        <div class="form-group">

            <label>
                管理密碼
            </label>

            <input
                type="password"
                id="adminPassword"
                placeholder="請輸入管理密碼"
                autocomplete="current-password"
                onkeydown="
                    if(event.key === 'Enter')
                    loginAdmin()
                "
            >

        </div>


        <div class="form-actions">

            <button
                class="secondary-button"
                onclick="closeModal('loginModal')"
            >
                取消
            </button>

            <button
                class="primary-button"
                onclick="loginAdmin()"
            >
                登入
            </button>

        </div>

    </div>

</div>



<!-- =========================================
     管理面板
========================================= -->

<div
    class="modal"
    id="adminModal"
>

    <div class="modal-box">

        <div class="modal-header">

            <h2>
                🛠️ 工具管理
            </h2>

            <button
                class="close-button"
                onclick="logoutAdmin()"
            >
                ×
            </button>

        </div>


        <div class="admin-toolbar">

            <strong>
                我的工具
            </strong>

            <button
                class="add-button"
                onclick="openToolForm()"
            >
                ＋ 新增工具
            </button>

        </div>


        <div
            class="admin-list"
            id="adminToolList"
        >

            正在載入……

        </div>

    </div>

</div>



<!-- =========================================
     新增 / 編輯工具
========================================= -->

<div
    class="modal"
    id="toolFormModal"
>

    <div class="modal-box">

        <div class="modal-header">

            <h2 id="toolFormTitle">
                ➕ 新增工具
            </h2>

            <button
                class="close-button"
                onclick="closeModal('toolFormModal')"
            >
                ×
            </button>

        </div>


        <form
            id="toolForm"
            onsubmit="saveTool(event)"
        >


            <div class="form-group">

                <label>
                    網站名稱
                </label>

                <input
                    type="text"
                    id="toolName"
                    placeholder="例如：六上自然自主學習網站"
                    required
                >

            </div>


            <div class="form-group">

                <label>
                    網站網址
                </label>

                <input
                    type="url"
                    id="toolUrl"
                    placeholder="https://xxxxx.netlify.app/"
                    required
                >

            </div>


            <div class="form-grid">


                <div class="form-group">

                    <label>
                        學習領域
                    </label>

                    <input
                        type="text"
                        id="toolCategory"
                        placeholder="例如：自然"
                        required
                    >

                </div>


                <div class="form-group">

                    <label>
                        學習階段
                    </label>

                    <input
                        type="text"
                        id="toolGrade"
                        placeholder="例如：中年級"
                        required
                    >

                </div>


            </div>


            <div class="form-group">

                <label>
                    圖示
                </label>

                <input
                    type="text"
                    id="toolIcon"
                    placeholder="例如：🔬"
                    maxlength="10"
                    required
                >

            </div>


            <div class="form-group">

                <label>
                    簡短介紹
                </label>

                <textarea
                    id="toolDescription"
                    placeholder="簡單介紹這個網站可以做什麼……"
                    required
                ></textarea>

            </div>


            <div class="form-actions">

                <button
                    type="button"
                    class="secondary-button"
                    onclick="
                        closeModal('toolFormModal')
                    "
                >
                    取消
                </button>


                <button
                    type="submit"
                    class="primary-button"
                    id="saveToolButton"
                >
                    儲存工具
                </button>

            </div>


        </form>

    </div>

</div>



<!-- Toast -->

<div
    class="toast"
    id="toast"
></div>



<script>


/* ==================================================
   全域變數
================================================== */

let tools = [];

let currentCategory = "全部";

let currentGrade = "全部";

let editingToolId = null;

let adminPassword = "";



/* ==================================================
   API
================================================== */

const API_URL =
    "./.netlify/functions/manage-tools";



/* ==================================================
   Toast
================================================== */

function showToast(message) {

    const toast =
        document.getElementById(
            "toast"
        );

    toast.textContent =
        message;

    toast.classList.add(
        "show"
    );


    setTimeout(() => {

        toast.classList.remove(
            "show"
        );

    }, 2800);

}



/* ==================================================
   Modal
================================================== */

function openModal(id) {

    document
        .getElementById(id)
        .classList.add("show");

}


function closeModal(id) {

    document
        .getElementById(id)
        .classList.remove("show");

}



/* ==================================================
   讀取工具
================================================== */

async function loadTools() {

    try {

        const response =
            await fetch(API_URL);


        if (!response.ok) {

            throw new Error(
                "工具資料載入失敗"
            );

        }


        const data =
            await response.json();


        if (!data.success) {

            throw new Error(
                data.message ||
                "工具資料載入失敗"
            );

        }


        tools =
            Array.isArray(data.tools)
                ? data.tools
                : [];


        createCategories();

        createGrades();

        renderTools();

    }

    catch (error) {

        console.error(error);


        document
            .getElementById(
                "toolsContainer"
            )
            .innerHTML = `

                <div class="empty">

                    <div class="empty-icon">
                        ⚠️
                    </div>

                    <h3>
                        工具資料載入失敗
                    </h3>

                    <p>
                        ${escapeHtml(
                            error.message
                        )}
                    </p>

                </div>

            `;

    }

}



/* ==================================================
   HTML 防護
================================================== */

function escapeHtml(value) {

    if (
        value === null ||
        value === undefined
    ) {

        return "";

    }


    return String(value)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");

}



/* ==================================================
   分類：學習領域
================================================== */

function createCategories() {

    const container =
        document.getElementById(
            "categoryContainer"
        );


    const categories = [

        "全部",

        ...new Set(

            tools
                .map(
                    tool =>
                        tool.category
                )
                .filter(Boolean)

        )

    ];


    container.innerHTML = "";


    categories.forEach(
        category => {

            const button =
                document.createElement(
                    "button"
                );


            button.className =
                "category-btn";


            if (
                category ===
                currentCategory
            ) {

                button.classList.add(
                    "active"
                );

            }


            button.textContent =
                category;


            button.onclick = () => {

                currentCategory =
                    category;


                document
                    .querySelectorAll(
                        "#categoryContainer .category-btn"
                    )
                    .forEach(
                        btn =>
                            btn.classList.remove(
                                "active"
                            )
                    );


                button.classList.add(
                    "active"
                );


                renderTools();

            };


            container.appendChild(
                button
            );

        }
    );

}



/* ==================================================
   分類：學習階段
================================================== */

function createGrades() {

    const container =
        document.getElementById(
            "gradeContainer"
        );


    const grades = [

        "全部",

        ...new Set(

            tools
                .map(
                    tool =>
                        tool.grade
                )
                .filter(Boolean)

        )

    ];


    container.innerHTML = "";


    grades.forEach(
        grade => {

            const button =
                document.createElement(
                    "button"
                );


            button.className =
                "category-btn";


            if (
                grade ===
                currentGrade
            ) {

                button.classList.add(
                    "active"
                );

            }


            button.textContent =
                grade;


            button.onclick = () => {

                currentGrade =
                    grade;


                document
                    .querySelectorAll(
                        "#gradeContainer .category-btn"
                    )
                    .forEach(
                        btn =>
                            btn.classList.remove(
                                "active"
                            )
                    );


                button.classList.add(
                    "active"
                );


                renderTools();

            };


            container.appendChild(
                button
            );

        }
    );

}



/* ==================================================
   顯示工具
================================================== */

function renderTools() {

    const container =
        document.getElementById(
            "toolsContainer"
        );


    const keyword =
        document
            .getElementById(
                "searchInput"
            )
            .value
            .trim()
            .toLowerCase();


    const filteredTools =
        tools.filter(
            tool => {


                const matchCategory =

                    currentCategory ===
                    "全部" ||

                    tool.category ===
                    currentCategory;


                const matchGrade =

                    currentGrade ===
                    "全部" ||

                    tool.grade ===
                    currentGrade;


                const searchText = (

                    tool.name +
                    " " +
                    tool.category +
                    " " +
                    tool.description +
                    " " +
                    tool.grade

                ).toLowerCase();


                const matchSearch =
                    searchText.includes(
                        keyword
                    );


                return (

                    matchCategory &&
                    matchGrade &&
                    matchSearch

                );

            }
        );


    document.getElementById(
        "toolCount"
    ).textContent =
        `共 ${filteredTools.length} 個工具`;


    if (
        filteredTools.length === 0
    ) {

        container.innerHTML = `

            <div class="empty">

                <div class="empty-icon">
                    🔍
                </div>

                <h3>
                    找不到符合的工具
                </h3>

                <p>
                    試試其他關鍵字或分類。
                </p>

            </div>

        `;

        return;

    }


    container.innerHTML =
        filteredTools
            .map(
                tool => {


                    const url =
                        escapeHtml(
                            tool.url
                        );


                    return `

                        <article
                            class="tool-card"
                        >

                            <div
                                class="tool-icon"
                            >
                                ${escapeHtml(
                                    tool.icon
                                )}
                            </div>


                            <div
                                class="tool-category"
                            >
                                ${escapeHtml(
                                    tool.category
                                )}
                            </div>


                            <div
                                class="tool-name"
                            >
                                ${escapeHtml(
                                    tool.name
                                )}
                            </div>


                            <div
                                class="tool-description"
                            >
                                ${escapeHtml(
                                    tool.description
                                )}
                            </div>


                            <div
                                class="tool-footer"
                            >

                                <span
                                    class="grade"
                                >
                                    ${escapeHtml(
                                        tool.grade
                                    )}
                                </span>


                                ${
                                    tool.url &&
                                    tool.url !== "#"

                                    ?

                                    `

                                        <a
                                            class="tool-link"
                                            href="${url}"
                                            target="_blank"
                                            rel="noopener noreferrer"
                                        >
                                            🚀 開始使用
                                        </a>

                                    `

                                    :

                                    `

                                        <span
                                            class="grade"
                                        >
                                            🚧 建置中
                                        </span>

                                    `
                                }

                            </div>

                        </article>

                    `;

                }
            )
            .join("");

}



/* ==================================================
   搜尋
================================================== */

document
    .getElementById(
        "searchInput"
    )
    .addEventListener(
        "input",
        renderTools
    );



/* ==================================================
   管理者登入
================================================== */

function openLogin() {

    document
        .getElementById(
            "adminPassword"
        )
        .value = "";


    openModal(
        "loginModal"
    );


    setTimeout(
        () => {

            document
                .getElementById(
                    "adminPassword"
                )
                .focus();

        },
        100
    );

}



/* ==================================================
   登入驗證
================================================== */

async function loginAdmin() {

    const password =
        document
            .getElementById(
                "adminPassword"
            )
            .value
            .trim();


    if (!password) {

        showToast(
            "請輸入管理密碼"
        );

        return;

    }


    const button =
        document.querySelector(
            "#loginModal .primary-button"
        );


    button.disabled = true;

    button.textContent =
        "驗證中……";


    try {

        const response =
            await fetch(
                API_URL,
                {

                    method: "POST",

                    headers: {

                        "Content-Type":
                            "application/json",

                        "X-Admin-Password":
                            password

                    },

                    body:
                        JSON.stringify({

                            action:
                                "login"

                        })

                }
            );


        const data =
            await response.json();


        if (
            !response.ok ||
            !data.success
        ) {

            throw new Error(
                data.message ||
                "登入失敗"
            );

        }


        // 登入成功
        adminPassword =
            password;


        closeModal(
            "loginModal"
        );


        showToast(
            "🔓 登入成功"
        );


        await openAdminPanel();

    }

    catch (error) {

        showToast(
            error.message ||
            "登入失敗"
        );

    }

    finally {

        button.disabled =
            false;

        button.textContent =
            "登入";

    }

}

/* ==================================================
   開啟管理面板
================================================== */

async function openAdminPanel() {

    openModal(
        "adminModal"
    );


    await renderAdminList();

}



/* ==================================================
   管理列表
================================================== */

async function renderAdminList() {

    const container =
        document.getElementById(
            "adminToolList"
        );


    container.innerHTML =
        "正在載入工具……";


    try {

        const response =
            await fetch(
                API_URL
            );


        const data =
            await response.json();


        if (!data.success) {

            throw new Error(
                data.message
            );

        }


        tools =
            data.tools || [];


        createCategories();

        createGrades();

        renderTools();


        if (
            tools.length === 0
        ) {

            container.innerHTML = `

                <div class="empty">

                    <div class="empty-icon">
                        📭
                    </div>

                    尚未建立工具

                </div>

            `;

            return;

        }


        container.innerHTML =
            tools
                .map(
                    tool => `

                        <div
                            class="admin-item"
                        >

                            <div
                                class="admin-item-icon"
                            >
                                ${escapeHtml(
                                    tool.icon
                                )}
                            </div>


                            <div
                                class="admin-item-info"
                            >

                                <div
                                    class="admin-item-name"
                                >
                                    ${escapeHtml(
                                        tool.name
                                    )}
                                </div>


                                <div
                                    class="admin-item-category"
                                >
                                    ${escapeHtml(
                                        tool.category
                                    )}
                                    ・
                                    ${escapeHtml(
                                        tool.grade
                                    )}
                                </div>

                            </div>


                            <div
                                class="admin-item-actions"
                            >

                                <button
                                    class="edit-button"
                                    onclick="editTool('${escapeHtml(
                                        String(tool.id || "")
                                    )}')"
                                >
                                    ✏️ 編輯
                                </button>


                                <button
                                    class="danger-button"
                                    onclick="deleteTool('${escapeHtml(
                                        String(tool.id || "")
                                    )}')"
                                >
                                    🗑️ 刪除
                                </button>

                            </div>

                        </div>

                    `
                )
                .join("");

    }

    catch (error) {

        container.innerHTML = `

            <div class="empty">

                <div class="empty-icon">
                    ⚠️
                </div>

                ${escapeHtml(
                    error.message
                )}

            </div>

        `;

    }

}



/* ==================================================
   開啟新增工具
================================================== */

function openToolForm() {

    editingToolId =
        null;


    document
        .getElementById(
            "toolFormTitle"
        )
        .textContent =
        "➕ 新增工具";


    document
        .getElementById(
            "toolForm"
        )
        .reset();


    openModal(
        "toolFormModal"
    );

}



/* ==================================================
   編輯工具
================================================== */

function editTool(id) {

    const tool =
        tools.find(
            item =>
                String(item.id) ===
                String(id)
        );


    if (!tool) {

        showToast(
            "找不到這個工具"
        );

        return;

    }


    editingToolId =
        id;


    document
        .getElementById(
            "toolFormTitle"
        )
        .textContent =
        "✏️ 編輯工具";


    document
        .getElementById(
            "toolName"
        )
        .value =
        tool.name || "";


    document
        .getElementById(
            "toolUrl"
        )
        .value =
        tool.url || "";


    document
        .getElementById(
            "toolCategory"
        )
        .value =
        tool.category || "";


    document
        .getElementById(
            "toolGrade"
        )
        .value =
        tool.grade || "";


    document
        .getElementById(
            "toolIcon"
        )
        .value =
        tool.icon || "";


    document
        .getElementById(
            "toolDescription"
        )
        .value =
        tool.description || "";


    openModal(
        "toolFormModal"
    );

}



/* ==================================================
   儲存工具
================================================== */

async function saveTool(event) {

    event.preventDefault();


    if (!adminPassword) {

        showToast(
            "管理登入已失效，請重新登入"
        );

        closeModal(
            "toolFormModal"
        );

        openLogin();

        return;

    }


    const button =
        document.getElementById(
            "saveToolButton"
        );


    const tool = {

        name:
            document
                .getElementById(
                    "toolName"
                )
                .value
                .trim(),

        url:
            document
                .getElementById(
                    "toolUrl"
                )
                .value
                .trim(),

        category:
            document
                .getElementById(
                    "toolCategory"
                )
                .value
                .trim(),

        grade:
            document
                .getElementById(
                    "toolGrade"
                )
                .value
                .trim(),

        icon:
            document
                .getElementById(
                    "toolIcon"
                )
                .value
                .trim(),

        description:
            document
                .getElementById(
                    "toolDescription"
                )
                .value
                .trim()

    };


    button.disabled =
        true;

    button.textContent =
        "儲存中……";


    try {

        let response;


        /*
         * 新增
         */

        if (
            editingToolId ===
            null
        ) {

            response =
                await fetch(
                    API_URL,
                    {

                        method: "POST",

                        headers: {

                            "Content-Type":
                                "application/json",

                            "X-Admin-Password":
                                adminPassword

                        },

                        body:
                            JSON.stringify(
                                tool
                            )

                    }
                );

        }


        /*
         * 編輯
         */

        else {

            response =
                await fetch(
                    API_URL,
                    {

                        method: "PUT",

                        headers: {

                            "Content-Type":
                                "application/json",

                            "X-Admin-Password":
                                adminPassword

                        },

                        body:
                            JSON.stringify({

                                id:
                                    editingToolId,

                                ...tool

                            })

                    }
                );

        }


        const data =
            await response.json();


        if (
            response.status ===
            401
        ) {

            adminPassword =
                "";

            throw new Error(
                "登入已失效，請重新登入"
            );

        }


        if (
            !response.ok ||
            !data.success
        ) {

            throw new Error(
                data.message ||
                "儲存失敗"
            );

        }


        showToast(
            editingToolId === null
                ? "🎉 工具新增成功！"
                : "🎉 工具修改成功！"
        );


        closeModal(
            "toolFormModal"
        );


        await renderAdminList();


        /*
         * 等待 Netlify 部署後，
         * 再重新讀取首頁資料。
         */

        setTimeout(
            loadTools,
            3000
        );

    }

    catch (error) {

        showToast(
            error.message ||
            "儲存失敗"
        );

    }

    finally {

        button.disabled =
            false;

        button.textContent =
            "儲存工具";

    }

}



/* ==================================================
   刪除工具
================================================== */

async function deleteTool(id) {

    const tool =
        tools.find(
            item =>
                String(item.id) ===
                String(id)
        );


    if (!tool) {

        showToast(
            "找不到這個工具"
        );

        return;

    }


    const confirmed =
        confirm(
            `確定要刪除「${tool.name}」嗎？\n\n刪除後會直接更新工具中心。`
        );


    if (!confirmed) {

        return;

    }


    try {

        const response =
            await fetch(
                API_URL,
                {

                    method: "DELETE",

                    headers: {

                        "Content-Type":
                            "application/json",

                        "X-Admin-Password":
                            adminPassword

                    },

                    body:
                        JSON.stringify({

                            id

                        })

                }
            );


        const data =
            await response.json();


        if (
            response.status ===
            401
        ) {

            adminPassword =
                "";

            throw new Error(
                "登入已失效，請重新登入"
            );

        }


        if (
            !response.ok ||
            !data.success
        ) {

            throw new Error(
                data.message ||
                "刪除失敗"
            );

        }


        showToast(
            "🗑️ 工具已刪除"
        );


        await renderAdminList();


        setTimeout(
            loadTools,
            3000
        );

    }

    catch (error) {

        showToast(
            error.message ||
            "刪除失敗"
        );

    }

}



/* ==================================================
   登出
================================================== */

function logoutAdmin() {

    adminPassword =
        "";


    closeModal(
        "adminModal"
    );


    closeModal(
        "toolFormModal"
    );


    showToast(
        "已登出管理模式"
    );

}



/* ==================================================
   點擊 Modal 背景關閉
================================================== */

document
    .querySelectorAll(".modal")
    .forEach(
        modal => {

            modal.addEventListener(
                "click",
                event => {

                    if (
                        event.target ===
                        modal
                    ) {

                        modal.classList.remove(
                            "show"
                        );

                    }

                }
            );

        }
    );



/* ==================================================
   啟動
================================================== */

loadTools();


</script>
