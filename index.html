<!DOCTYPE html>
<html lang="zh-Hant">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<title>民生國小 AI 教育工具中心</title>

<meta
    name="description"
    content="民生國小 AI 教育工具中心，依學習領域與學習階段快速找到適合的學習工具。"
>


<style>

/* =========================
   基本設定
========================= */

* {
    box-sizing: border-box;
}

html {
    scroll-behavior: smooth;
}

body {

    margin: 0;

    font-family:
        "Noto Sans TC",
        "Microsoft JhengHei",
        Arial,
        sans-serif;

    background:
        radial-gradient(
            circle at top left,
            #dbeafe 0%,
            transparent 35%
        ),
        radial-gradient(
            circle at top right,
            #ede9fe 0%,
            transparent 35%
        ),
        #f8fafc;

    color: #1e293b;

    min-height: 100vh;
}


/* =========================
   Header
========================= */

header {

    position: relative;

    overflow: hidden;

    padding: 55px 20px 75px;

    background:
        linear-gradient(
            135deg,
            #312e81,
            #4f46e5,
            #7c3aed
        );

    color: white;

    text-align: center;
}


header::before {

    content: "";

    position: absolute;

    width: 300px;
    height: 300px;

    top: -150px;
    left: -80px;

    border-radius: 50%;

    background:
        rgba(255,255,255,0.08);
}


header::after {

    content: "";

    position: absolute;

    width: 400px;
    height: 400px;

    right: -150px;
    bottom: -250px;

    border-radius: 50%;

    background:
        rgba(255,255,255,0.08);
}


.hero {

    position: relative;

    z-index: 2;

    max-width: 900px;

    margin: auto;
}


.hero-icon {

    font-size: 60px;

    margin-bottom: 10px;
}


.hero h1 {

    margin: 0;

    font-size:
        clamp(
            32px,
            6vw,
            54px
        );

    font-weight: 900;

    letter-spacing: 2px;
}


.hero p {

    margin:
        15px 0 0;

    font-size:
        clamp(
            16px,
            2vw,
            21px
        );

    opacity: 0.9;
}


.hero-subtitle {

    margin-top: 8px;

    font-size: 14px;

    opacity: 0.75;
}


/* =========================
   Main
========================= */

main {

    max-width: 1200px;

    margin:
        -35px auto 0;

    padding:
        0 20px 60px;

    position: relative;

    z-index: 5;
}


/* =========================
   搜尋
========================= */

.search-box {

    background: white;

    border-radius: 20px;

    padding: 10px;

    box-shadow:
        0 15px 40px
        rgba(
            15,
            23,
            42,
            0.12
        );

    display: flex;

    align-items: center;
}


.search-icon {

    font-size: 25px;

    margin:
        0 10px;
}


#searchInput {

    border: none;

    outline: none;

    flex: 1;

    font-size: 18px;

    padding: 15px;

    background: transparent;

    color: #1e293b;
}


#searchInput::placeholder {

    color:
        #94a3b8;
}


/* =========================
   分類區
========================= */

.filter-section {

    margin-top: 30px;
}


.filter-title {

    font-size: 18px;

    font-weight: 900;

    margin-bottom: 12px;
}


.filter-buttons {

    display: flex;

    flex-wrap: wrap;

    gap: 10px;
}


.filter-btn {

    border: none;

    background: white;

    color: #475569;

    padding:
        10px 17px;

    border-radius: 999px;

    font-size: 14px;

    font-weight: 700;

    cursor: pointer;

    box-shadow:
        0 4px 15px
        rgba(
            15,
            23,
            42,
            0.07
        );

    transition:
        0.2s;
}


.filter-btn:hover {

    transform:
        translateY(-2px);
}


.filter-btn.active {

    background:
        #4f46e5;

    color:
        white;

    box-shadow:
        0 7px 18px
        rgba(
            79,
            70,
            229,
            0.25
        );
}


/* =========================
   工具標題
========================= */

.tools-header {

    display: flex;

    justify-content:
        space-between;

    align-items:
        center;

    margin:
        38px 0 18px;
}


.tools-header h2 {

    margin: 0;

    font-size: 25px;
}


.tool-count {

    color:
        #64748b;

    font-size:
        14px;
}


/* =========================
   工具卡片
========================= */

#toolsContainer {

    display: grid;

    grid-template-columns:
        repeat(
            auto-fit,
            minmax(
                270px,
                1fr
            )
        );

    gap: 20px;
}


.tool-card {

    background:
        white;

    border-radius:
        22px;

    padding:
        24px;

    min-height:
        245px;

    border:
        1px solid
        rgba(
            226,
            232,
            240,
            0.9
        );

    box-shadow:
        0 8px 25px
        rgba(
            15,
            23,
            42,
            0.08
        );

    display:
        flex;

    flex-direction:
        column;

    transition:
        transform 0.25s,
        box-shadow 0.25s;
}


.tool-card:hover {

    transform:
        translateY(-6px);

    box-shadow:
        0 18px 40px
        rgba(
            15,
            23,
            42,
            0.14
        );
}


.tool-icon {

    font-size:
        48px;

    margin-bottom:
        12px;
}


.tool-category {

    display:
        inline-block;

    color:
        #6366f1;

    font-size:
        13px;

    font-weight:
        800;

    margin-bottom:
        6px;
}


.tool-name {

    font-size:
        21px;

    font-weight:
        900;

    line-height:
        1.4;

    margin-bottom:
        9px;
}


.tool-description {

    color:
        #64748b;

    font-size:
        14px;

    line-height:
        1.65;

    flex:
        1;
}


.tool-footer {

    display:
        flex;

    justify-content:
        space-between;

    align-items:
        center;

    gap:
        10px;

    margin-top:
        20px;
}


.stage {

    background:
        #f1f5f9;

    color:
        #475569;

    padding:
        6px 10px;

    border-radius:
        8px;

    font-size:
        12px;

    font-weight:
        700;
}


.tool-link {

    display:
        inline-flex;

    align-items:
        center;

    gap:
        5px;

    background:
        #4f46e5;

    color:
        white;

    text-decoration:
        none;

    padding:
        9px 14px;

    border-radius:
        10px;

    font-size:
        13px;

    font-weight:
        800;

    transition:
        0.2s;
}


.tool-link:hover {

    background:
        #3730a3;
}


.building {

    background:
        #f1f5f9;

    color:
        #64748b;

    padding:
        8px 12px;

    border-radius:
        9px;

    font-size:
        12px;

    font-weight:
        700;
}


/* =========================
   找不到工具
========================= */

.empty {

    grid-column:
        1 / -1;

    text-align:
        center;

    padding:
        70px 20px;

    color:
        #64748b;
}


.empty-icon {

    font-size:
        60px;

    margin-bottom:
        15px;
}


/* =========================
   Footer
========================= */

footer {

    text-align:
        center;

    padding:
        30px 20px 45px;

    color:
        #64748b;

    font-size:
        13px;
}


footer strong {

    color:
        #4f46e5;
}


/* =========================
   手機版
========================= */

@media (
    max-width: 600px
) {

    header {

        padding:
            45px 18px 65px;
    }


    .hero-icon {

        font-size:
            50px;
    }


    main {

        padding-left:
            14px;

        padding-right:
            14px;
    }


    #toolsContainer {

        grid-template-columns:
            1fr;
    }


    .tools-header {

        align-items:
            flex-start;

        gap:
            10px;

        flex-direction:
            column;
    }

}

</style>

</head>


<body>


<!-- =========================
     Header
========================= -->

<header>

<div class="hero">

<div class="hero-icon">
🤖
</div>

<h1>
AI 教育工具中心
</h1>

<p>
AI × 教育 × 創意 × 學習
</p>

<div class="hero-subtitle">
民生國小 AI 教育工具平台
</div>

</div>

</header>



<main>


<!-- =========================
     搜尋
========================= -->

<div class="search-box">

<span class="search-icon">
🔎
</span>

<input
    type="text"
    id="searchInput"
    placeholder="搜尋工具名稱、學習領域或學習階段……"
>

</div>



<!-- =========================
     學習領域
========================= -->

<section class="filter-section">

<div class="filter-title">
📚 學習領域
</div>

<div
    class="filter-buttons"
    id="categoryContainer"
></div>

</section>



<!-- =========================
     學習階段
========================= -->

<section class="filter-section">

<div class="filter-title">
🏫 學習階段
</div>

<div
    class="filter-buttons"
    id="stageContainer"
></div>

</section>



<!-- =========================
     工具
========================= -->

<div class="tools-header">

<h2>
🧰 學習工具
</h2>

<span
    class="tool-count"
    id="toolCount"
>
載入中……
</span>

</div>


<div id="toolsContainer">

<div class="empty">

<div class="empty-icon">
⏳
</div>

正在載入工具……

</div>

</div>


</main>



<footer>

<strong>
民生國小 AI 教育工具中心
</strong>

<br>

AI × 教育 × 創意 × 未來

</footer>



<script>


/* =========================
   全域資料
========================= */

let tools = [];

let currentCategory = "全部";

let currentStage = "全部";


/* =========================
   讀取 tools.json
========================= */

async function loadTools() {

    try {

        const response =
            await fetch(
                "./tools.json"
            );


        if (!response.ok) {

            throw new Error(
                "無法讀取 tools.json"
            );

        }


        tools =
            await response.json();


        createCategories();

        createStages();

        renderTools();

    }

    catch (error) {

        console.error(error);


        document.getElementById(
            "toolsContainer"
        ).innerHTML = `

        <div class="empty">

            <div class="empty-icon">
                ⚠️
            </div>

            <h3>
                工具資料載入失敗
            </h3>

            <p>
                請確認 tools.json 是否存在，
                並檢查 JSON 格式。
            </p>

        </div>

        `;

    }

}


/* =========================
   建立學習領域
========================= */

function createCategories() {

    const container =
        document.getElementById(
            "categoryContainer"
        );


    const categories = [

        "全部",

        ...new Set(

            tools
                .map(
                    tool =>
                        tool.category
                )
                .filter(Boolean)

        )

    ];


    container.innerHTML = "";


    categories.forEach(
        category => {

            const button =
                document.createElement(
                    "button"
                );


            button.className =
                "filter-btn";


            if (
                category ===
                currentCategory
            ) {

                button.classList.add(
                    "active"
                );

            }


            button.textContent =
                category;


            button.onclick = () => {

                currentCategory =
                    category;


                updateFilterButtons(
                    "categoryContainer",
                    category
                );


                renderTools();

            };


            container.appendChild(
                button
            );

        }
    );

}


/* =========================
   建立學習階段
========================= */

function createStages() {

    const container =
        document.getElementById(
            "stageContainer"
        );


    const stages = [

        "全部",

        ...new Set(

            tools
                .map(
                    tool =>
                        tool.stage
                )
                .filter(Boolean)

        )

    ];


    container.innerHTML = "";


    stages.forEach(
        stage => {

            const button =
                document.createElement(
                    "button"
                );


            button.className =
                "filter-btn";


            if (
                stage ===
                currentStage
            ) {

                button.classList.add(
                    "active"
                );

            }


            button.textContent =
                stage;


            button.onclick = () => {

                currentStage =
                    stage;


                updateFilterButtons(
                    "stageContainer",
                    stage
                );


                renderTools();

            };


            container.appendChild(
                button
            );

        }
    );

}


/* =========================
   更新按鈕
========================= */

function updateFilterButtons(
    containerId,
    selected
) {

    document
        .getElementById(
            containerId
        )
        .querySelectorAll(
            ".filter-btn"
        )
        .forEach(
            button => {

                button.classList.toggle(
                    "active",
                    button.textContent ===
                    selected
                );

            }
        );

}


/* =========================
   篩選工具
========================= */

function getFilteredTools() {

    const keyword =

        document
            .getElementById(
                "searchInput"
            )
            .value
            .trim()
            .toLowerCase();


    return tools.filter(
        tool => {


            const matchCategory =

                currentCategory ===
                "全部"

                ||

                tool.category ===
                currentCategory;


            const matchStage =

                currentStage ===
                "全部"

                ||

                tool.stage ===
                currentStage;


            const searchText = [

                tool.name,

                tool.category,

                tool.stage,

                tool.description

            ]

            .filter(Boolean)

            .join(" ")

            .toLowerCase();


            const matchSearch =

                searchText.includes(
                    keyword
                );


            return (

                matchCategory &&

                matchStage &&

                matchSearch

            );

        }
    );

}


/* =========================
   工具卡片
========================= */

function createToolCard(tool) {

    const isAvailable =

        tool.url &&

        tool.url !== "#";


    return `

    <article class="tool-card">


        <div class="tool-icon">
            ${tool.icon || "🤖"}
        </div>


        <div class="tool-category">
            ${tool.category || "其他"}
        </div>


        <div class="tool-name">
            ${tool.name || "未命名工具"}
        </div>


        <div class="tool-description">
            ${tool.description || ""}
        </div>


        <div class="tool-footer">


            <span class="stage">
                🏫 ${tool.stage || "全學段"}
            </span>


            ${
                isAvailable

                ?

                `

                <a
                    class="tool-link"
                    href="${tool.url}"
                    target="_blank"
                    rel="noopener noreferrer"
                >
                    🚀 開始使用
                </a>

                `

                :

                `

                <span class="building">
                    🚧 建置中
                </span>

                `
            }


        </div>


    </article>

    `;

}


/* =========================
   顯示工具
========================= */

function renderTools() {

    const container =
        document.getElementById(
            "toolsContainer"
        );


    const filteredTools =
        getFilteredTools();


    document.getElementById(
        "toolCount"
    ).textContent =

        `共 ${filteredTools.length} 個工具`;


    if (
        filteredTools.length === 0
    ) {

        container.innerHTML = `

        <div class="empty">

            <div class="empty-icon">
                🔍
            </div>

            <h3>
                找不到符合的工具
            </h3>

            <p>
                請換一個學習領域、學習階段或關鍵字。
            </p>

        </div>

        `;

        return;

    }


    container.innerHTML =

        filteredTools
            .map(
                createToolCard
            )
            .join("");

}


/* =========================
   搜尋
========================= */

document
    .getElementById(
        "searchInput"
    )
    .addEventListener(
        "input",
        renderTools
    );


/* =========================
   啟動
========================= */

loadTools();

</script>


</body>

</html>
