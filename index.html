<!DOCTYPE html>
<html lang="zh-Hant">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<title>民生國小 AI 教育工具中心</title>

<meta
    name="description"
    content="民生國小 AI 教育工具中心，整合學科學習、AI工具、課堂工具與學習遊戲。"
>


<style>

/* =================================
   基礎
================================= */

* {
    box-sizing: border-box;
}

html {
    scroll-behavior: smooth;
}

body {

    margin: 0;

    font-family:
        "Noto Sans TC",
        "Microsoft JhengHei",
        Arial,
        sans-serif;

    background:

        radial-gradient(
            circle at top left,
            #dbeafe 0%,
            transparent 35%
        ),

        radial-gradient(
            circle at top right,
            #ede9fe 0%,
            transparent 35%
        ),

        #f8fafc;

    color: #1e293b;

    min-height: 100vh;

}


/* =================================
   Header
================================= */

header {

    position: relative;

    overflow: hidden;

    padding:
        60px 20px 95px;

    background:

        linear-gradient(
            135deg,
            #312e81,
            #4f46e5,
            #7c3aed
        );

    color: white;

    text-align: center;

}


header::before,
header::after {

    content: "";

    position: absolute;

    border-radius: 50%;

    background:
        rgba(255,255,255,0.08);

    pointer-events: none;

}


header::before {

    width: 320px;
    height: 320px;

    top: -160px;
    left: -100px;

}


header::after {

    width: 450px;
    height: 450px;

    right: -180px;
    bottom: -280px;

}


.hero {

    position: relative;

    z-index: 2;

    max-width: 900px;

    margin: auto;

}


.hero-icon {

    font-size: 68px;

    margin-bottom: 10px;

    animation:
        floatRobot
        3s
        ease-in-out
        infinite;

}


@keyframes floatRobot {

    0%,
    100% {
        transform:
            translateY(0);
    }

    50% {
        transform:
            translateY(-8px);
    }

}


.hero h1 {

    margin: 0;

    font-size:
        clamp(
            32px,
            6vw,
            56px
        );

    font-weight: 900;

    letter-spacing: 2px;

}


.hero p {

    margin:
        16px 0 0;

    font-size:
        clamp(
            16px,
            2vw,
            21px
        );

    opacity: 0.92;

}


.hero-subtitle {

    margin-top: 10px;

    font-size: 14px;

    opacity: 0.78;

}


/* =================================
   Main
================================= */

main {

    max-width: 1250px;

    margin:
        -40px auto 0;

    padding:
        0 20px 70px;

    position: relative;

    z-index: 5;

}


/* =================================
   搜尋
================================= */

.search-box {

    background: white;

    border-radius: 20px;

    padding:
        10px 15px;

    box-shadow:
        0 15px 40px
        rgba(
            15,
            23,
            42,
            0.13
        );

    display: flex;

    align-items: center;

    border:
        1px solid
        rgba(
            226,
            232,
            240,
            0.8
        );

}


.search-icon {

    font-size: 25px;

    margin:
        0 10px;

}


#searchInput {

    border: none;

    outline: none;

    flex: 1;

    font-size: 18px;

    padding: 15px;

    background:
        transparent;

    color:
        #1e293b;

}


#searchInput::placeholder {

    color:
        #94a3b8;

}


/* =================================
   統計
================================= */

.stats {

    display: grid;

    grid-template-columns:
        repeat(
            3,
            1fr
        );

    gap: 15px;

    margin:
        25px 0 35px;

}


.stat-card {

    background: white;

    border-radius: 20px;

    padding:
        20px;

    text-align: center;

    box-shadow:
        0 8px 25px
        rgba(
            15,
            23,
            42,
            0.07
        );

    border:
        1px solid
        #e2e8f0;

}


.stat-icon {

    font-size: 28px;

}


.stat-number {

    font-size: 28px;

    font-weight: 900;

    margin:
        4px 0;

    color:
        #4f46e5;

}


.stat-label {

    font-size: 13px;

    color:
        #64748b;

}


/* =================================
   Section
================================= */

.section {

    margin:
        35px 0;

}


.section-header {

    display: flex;

    justify-content:
        space-between;

    align-items:
        center;

    margin-bottom:
        18px;

}


.section-header h2 {

    margin: 0;

    font-size: 25px;

}


.section-description {

    color:
        #64748b;

    font-size:
        14px;

}


/* =================================
   精選
================================= */

.featured-grid {

    display: grid;

    grid-template-columns:
        repeat(
            auto-fit,
            minmax(
                250px,
                1fr
            )
        );

    gap: 18px;

}


.featured-card {

    position: relative;

    background:
        linear-gradient(
            135deg,
            #ffffff,
            #f5f3ff
        );

    border-radius:
        22px;

    padding:
        22px;

    border:
        1px solid
        #ddd6fe;

    box-shadow:
        0 8px 25px
        rgba(
            15,
            23,
            42,
            0.07
        );

    cursor: pointer;

    transition:
        0.25s;

}


.featured-card:hover {

    transform:
        translateY(-5px);

    box-shadow:
        0 16px 35px
        rgba(
            15,
            23,
            42,
            0.12
        );

}


.featured-icon {

    font-size:
        45px;

    margin-bottom:
        12px;

}


.featured-name {

    font-size:
        18px;

    font-weight:
        900;

    margin-bottom:
        6px;

}


.featured-description {

    color:
        #64748b;

    font-size:
        13px;

    line-height:
        1.6;

}


/* =================================
   學習領域
================================= */

.category-grid {

    display: grid;

    grid-template-columns:
        repeat(
            auto-fit,
            minmax(
                160px,
                1fr
            )
        );

    gap:
        15px;

}


.domain-card {

    background: white;

    border-radius:
        18px;

    padding:
        22px 15px;

    text-align:
        center;

    cursor:
        pointer;

    border:
        1px solid
        #e2e8f0;

    box-shadow:
        0 6px 18px
        rgba(
            15,
            23,
            42,
            0.06
        );

    transition:
        0.2s;

}


.domain-card:hover {

    transform:
        translateY(-4px);

    border-color:
        #a5b4fc;

}


.domain-icon {

    font-size:
        35px;

}


.domain-name {

    margin-top:
        8px;

    font-weight:
        800;

}


.domain-count {

    margin-top:
        4px;

    font-size:
        12px;

    color:
        #64748b;

}


/* =================================
   快速篩選
================================= */

.quick-filters {

    display: flex;

    flex-wrap: wrap;

    gap:
        10px;

    margin:
        20px 0 5px;

}


.quick-btn {

    border: none;

    padding:
        9px 15px;

    border-radius:
        999px;

    background:
        white;

    color:
        #475569;

    font-weight:
        700;

    cursor:
        pointer;

    box-shadow:
        0 4px 15px
        rgba(
            15,
            23,
            42,
            0.07
        );

    transition:
        0.2s;

}


.quick-btn:hover {

    transform:
        translateY(-2px);

}


.quick-btn.active {

    background:
        #4f46e5;

    color:
        white;

}


/* =================================
   分類
================================= */

.categories {

    display:
        flex;

    gap:
        10px;

    margin:
        20px 0 28px;

    overflow-x:
        auto;

    padding-bottom:
        5px;

}


.category-btn {

    border:
        none;

    background:
        white;

    padding:
        11px 18px;

    border-radius:
        999px;

    font-size:
        15px;

    font-weight:
        700;

    cursor:
        pointer;

    white-space:
        nowrap;

    box-shadow:
        0 4px 15px
        rgba(
            15,
            23,
            42,
            0.08
        );

    transition:
        0.2s;

}


.category-btn:hover {

    transform:
        translateY(-2px);

}


.category-btn.active {

    background:
        #4f46e5;

    color:
        white;

}


/* =================================
   工具卡片
================================= */

#toolsContainer {

    display:
        grid;

    grid-template-columns:
        repeat(
            auto-fit,
            minmax(
                280px,
                1fr
            )
        );

    gap:
        22px;

}


.tool-card {

    position:
        relative;

    background:
        white;

    border-radius:
        24px;

    padding:
        25px;

    box-shadow:
        0 8px 25px
        rgba(
            15,
            23,
            42,
            0.08
        );

    border:
        1px solid
        rgba(
            226,
            232,
            240,
            0.85
        );

    transition:
        0.25s;

    display:
        flex;

    flex-direction:
        column;

    min-height:
        285px;

    overflow:
        hidden;

}


.tool-card::before {

    content:
        "";

    position:
        absolute;

    top:
        0;

    left:
        0;

    right:
        0;

    height:
        4px;

    background:
        linear-gradient(
            90deg,
            #4f46e5,
            #7c3aed
        );

}


.tool-card:hover {

    transform:
        translateY(-7px);

    box-shadow:
        0 20px 45px
        rgba(
            15,
            23,
            42,
            0.15
        );

}


.badges {

    position:
        absolute;

    top:
        17px;

    right:
        17px;

    display:
        flex;

    gap:
        5px;

}


.badge {

    padding:
        5px 8px;

    border-radius:
        999px;

    font-size:
        11px;

    font-weight:
        900;

}


.badge-featured {

    background:
        #fef3c7;

    color:
        #92400e;

}


.badge-new {

    background:
        #dcfce7;

    color:
        #166534;

}


.badge-online {

    background:
        #ecfdf5;

    color:
        #047857;

}


.tool-icon {

    width:
        65px;

    height:
        65px;

    display:
        flex;

    align-items:
        center;

    justify-content:
        center;

    background:
        linear-gradient(
            135deg,
            #eef2ff,
            #f5f3ff
        );

    border-radius:
        18px;

    font-size:
        38px;

    margin-bottom:
        16px;

}


.tool-category {

    color:
        #6366f1;

    font-size:
        13px;

    font-weight:
        800;

    margin-bottom:
        6px;

}


.tool-name {

    font-size:
        21px;

    font-weight:
        900;

    line-height:
        1.35;

    margin-bottom:
        10px;

}


.tool-description {

    color:
        #64748b;

    line-height:
        1.65;

    font-size:
        14px;

    flex:
        1;

}


.tags {

    display:
        flex;

    flex-wrap:
        wrap;

    gap:
        5px;

    margin-top:
        15px;

}


.tag {

    background:
        #f8fafc;

    border:
        1px solid
        #e2e8f0;

    color:
        #64748b;

    border-radius:
        7px;

    padding:
        4px 7px;

    font-size:
        11px;

}


.tool-footer {

    display:
        flex;

    justify-content:
        space-between;

    align-items:
        center;

    gap:
        10px;

    margin-top:
        20px;

}


.tool-meta {

    display:
        flex;

    flex-wrap:
        wrap;

    gap:
        6px;

}


.grade {

    background:
        #f1f5f9;

    padding:
        6px 9px;

    border-radius:
        8px;

    font-size:
        12px;

    color:
        #475569;

}


.audience {

    background:
        #eef2ff;

    color:
        #4f46e5;

    padding:
        6px 9px;

    border-radius:
        8px;

    font-size:
        12px;

    font-weight:
        700;

}


.tool-link {

    display:
        inline-flex;

    align-items:
        center;

    justify-content:
        center;

    gap:
        5px;

    background:
        #4f46e5;

    color:
        white;

    text-decoration:
        none;

    padding:
        10px 15px;

    border-radius:
        11px;

    font-weight:
        800;

    font-size:
        13px;

    white-space:
        nowrap;

    transition:
        0.2s;

}


.tool-link:hover {

    background:
        #3730a3;

    transform:
        translateY(-1px);

}


/* =================================
   Empty
================================= */

.empty {

    grid-column:
        1 / -1;

    text-align:
        center;

    padding:
        70px 20px;

    color:
        #64748b;

}


.empty-icon {

    font-size:
        60px;

    margin-bottom:
        15px;

}


/* =================================
   Footer
================================= */

footer {

    text-align:
        center;

    padding:
        30px 20px 45px;

    color:
        #64748b;

    font-size:
        13px;

}


footer strong {

    color:
        #4f46e5;

}


/* =================================
   Mobile
================================= */

@media (max-width: 600px) {

    header {

        padding:
            45px 18px 75px;

    }

    .hero-icon {

        font-size:
            50px;

    }

    main {

        padding-left:
            14px;

        padding-right:
            14px;

    }

    .stats {

        grid-template-columns:
            1fr;

    }

    #toolsContainer {

        grid-template-columns:
            1fr;

    }

    .tool-card {

        min-height:
            270px;

    }

}

</style>

</head>


<body>


<header>

<div class="hero">

<div class="hero-icon">
🤖
</div>

<h1>
AI 教育工具中心
</h1>

<p>
AI × 教育 × 創意 × 學習
</p>

<div class="hero-subtitle">
民生國小 AI 教育工具平台
</div>

</div>

</header>



<main>


<!-- =================================
     搜尋
================================= -->

<div class="search-box">

<span class="search-icon">
🔎
</span>

<input
    type="text"
    id="searchInput"
    placeholder="搜尋工具、學科、年級、關鍵字……"
>

</div>



<!-- =================================
     統計
================================= -->

<div class="stats">

<div class="stat-card">

<div class="stat-icon">
🧰
</div>

<div
    class="stat-number"
    id="totalCount"
>
0
</div>

<div class="stat-label">
全部工具
</div>

</div>


<div class="stat-card">

<div class="stat-icon">
⭐
</div>

<div
    class="stat-number"
    id="featuredCount"
>
0
</div>

<div class="stat-label">
精選工具
</div>

</div>


<div class="stat-card">

<div class="stat-icon">
🟢
</div>

<div
    class="stat-number"
    id="onlineCount"
>
0
</div>

<div class="stat-label">
線上工具
</div>

</div>

</div>



<!-- =================================
     精選工具
================================= -->

<section class="section">

<div class="section-header">

<h2>
⭐ 精選工具
</h2>

<span class="section-description">
推薦使用
</span>

</div>


<div
    class="featured-grid"
    id="featuredContainer"
></div>

</section>



<!-- =================================
     學習領域
================================= -->

<section class="section">

<div class="section-header">

<h2>
📚 學習領域
</h2>

<span class="section-description">
探索不同學習工具
</span>

</div>


<div
    class="category-grid"
    id="domainContainer"
></div>

</section>



<!-- =================================
     篩選
================================= -->

<div class="quick-filters">

<button
    class="quick-btn active"
    data-filter="all"
>
🧰 全部
</button>

<button
    class="quick-btn"
    data-filter="featured"
>
⭐ 精選
</button>

<button
    class="quick-btn"
    data-filter="new"
>
🆕 最新
</button>

<button
    class="quick-btn"
    data-filter="teacher"
>
👨‍🏫 教師
</button>

<button
    class="quick-btn"
    data-filter="student"
>
👦 學生
</button>

</div>



<!-- =================================
     分類
================================= -->

<div
    class="categories"
    id="categoryContainer"
></div>



<!-- =================================
     工具
================================= -->

<section class="section">

<div class="section-header">

<h2>
🧰 全部 AI 工具
</h2>

<span
    class="section-description"
    id="toolCount"
>
載入中……
</span>

</div>


<div id="toolsContainer">

<div class="empty">

<div class="empty-icon">
⏳
</div>

正在載入工具……

</div>

</div>

</section>


</main>



<footer>

<strong>
民生國小 AI 教育工具中心
</strong>

<br>

AI × 教育 × 創意 × 未來

</footer>



<script>


/* =================================
   全域資料
================================= */

let tools = [];

let currentCategory = "全部";

let currentFilter = "all";



/* =================================
   讀取 JSON
================================= */

async function loadTools() {

try {

const response =
    await fetch(
        "./tools.json"
    );


if (!response.ok) {

throw new Error(
    "無法讀取 tools.json"
);

}


tools =
    await response.json();


updateStats();

createCategories();

createFeatured();

createDomains();

renderTools();


}

catch(error) {

console.error(error);


document.getElementById(
    "toolsContainer"
).innerHTML = `

<div class="empty">

<div class="empty-icon">
⚠️
</div>

<h3>
工具資料載入失敗
</h3>

<p>
請確認 tools.json 是否存在，
並檢查 JSON 格式。
</p>

</div>

`;

}

}


/* =================================
   統計
================================= */

function updateStats() {


document.getElementById(
    "totalCount"
).textContent =
    tools.length;


document.getElementById(
    "featuredCount"
).textContent =

tools.filter(
    tool =>
        tool.featured === true
).length;


document.getElementById(
    "onlineCount"
).textContent =

tools.filter(
    tool =>
        tool.status === "online"
).length;

}



/* =================================
   精選工具
================================= */

function createFeatured() {


const container =
    document.getElementById(
        "featuredContainer"
    );


const featured =
    tools.filter(
        tool =>
            tool.featured === true
    );


if (
    featured.length === 0
) {

container.innerHTML = `

<div class="empty">

目前尚無精選工具。

</div>

`;

return;

}


container.innerHTML =

featured
.slice(0, 4)
.map(tool => `

<div
    class="featured-card"
    onclick="openTool('${tool.url}')"
>

<div class="featured-icon">
${tool.icon || "🤖"}
</div>

<div class="featured-name">
${tool.name}
</div>

<div class="featured-description">
${tool.description}
</div>

</div>

`)
.join("");

}



/* =================================
   學習領域
================================= */

function createDomains() {


const container =
    document.getElementById(
        "domainContainer"
    );


const domainIcons = {

"國語學習": "📖",

"數學學習": "🔢",

"英語學習": "🇬🇧",

"資訊科技": "💻",

"AI工具": "🤖",

"創意設計": "🎨"

};


const counts = {};


tools.forEach(
    tool => {

        if (
            !tool.category
        ) return;

        counts[
            tool.category
        ] =
            (
                counts[
                    tool.category
                ] || 0
            ) + 1;

    }
);


container.innerHTML =

Object.keys(counts)
.map(category => `

<div
    class="domain-card"
    onclick="selectCategory('${category}')"
>

<div class="domain-icon">

${domainIcons[category] || "📚"}

</div>

<div class="domain-name">
${category}
</div>

<div class="domain-count">
${counts[category]} 個工具
</div>

</div>

`)
.join("");

}



/* =================================
   選擇領域
================================= */

function selectCategory(category) {


currentCategory =
    category;


document
.querySelectorAll(
    ".category-btn"
)
.forEach(btn => {

btn.classList.remove(
    "active"
);

});


const buttons =
    document
    .querySelectorAll(
        ".category-btn"
    );


buttons.forEach(
    button => {

        if (
            button.textContent ===
            category
        ) {

            button.classList.add(
                "active"
            );

        }

    }
);


renderTools();


document
.getElementById(
    "toolsContainer"
)
.scrollIntoView({
    behavior: "smooth"
});

}



/* =================================
   開啟工具
================================= */

function openTool(url) {

if (
    url &&
    url !== "#" &&
    !url.includes("請填入")
) {

window.open(
    url,
    "_blank"
);

}

}



/* =================================
   建立分類
================================= */

function createCategories() {


const container =
    document.getElementById(
        "categoryContainer"
    );


const categories = [

"全部",

...new Set(

tools
.map(
    tool =>
        tool.category
)
.filter(Boolean)

)

];


container.innerHTML = "";


categories.forEach(
    category => {


const button =
    document.createElement(
        "button"
    );


button.className =
    "category-btn";


if (
    category ===
    currentCategory
) {

button.classList.add(
    "active"
);

}


button.textContent =
    category;


button.addEventListener(
    "click",
    () => {


    currentCategory =
        category;


    document
    .querySelectorAll(
        ".category-btn"
    )
    .forEach(
        btn =>
            btn.classList
            .remove(
                "active"
            )
    );


    button.classList.add(
        "active"
    );


    renderTools();

    }
);


container.appendChild(
    button
);


}
);

}



/* =================================
   快速篩選
================================= */

function matchQuickFilter(tool) {


switch(
    currentFilter
) {


case "featured":

return (
    tool.featured === true
);


case "new":

return (
    tool.new === true
);


case "teacher":

return (
    Array.isArray(
        tool.audience
    )
    &&
    tool.audience.includes(
        "教師"
    )
);


case "student":

return (
    Array.isArray(
        tool.audience
    )
    &&
    tool.audience.includes(
        "學生"
    )
);


default:

return true;

}

}



/* =================================
   篩選工具
================================= */

function getFilteredTools() {


const keyword =

document
.getElementById(
    "searchInput"
)
.value
.trim()
.toLowerCase();


return tools.filter(
    tool => {


const matchCategory =

currentCategory ===
"全部"

||

tool.category ===
currentCategory;


const searchText = [

tool.name,

tool.category,

tool.description,

tool.grade,

...(tool.tags || []),

...(tool.audience || [])

]

.filter(Boolean)

.join(" ")

.toLowerCase();


const matchSearch =

searchText.includes(
    keyword
);


const matchFilter =
    matchQuickFilter(
        tool
    );


return (

matchCategory &&

matchSearch &&

matchFilter

);

}

);

}



/* =================================
   工具卡片
================================= */

function createToolCard(tool) {


const badges = [];


if (
    tool.featured
) {

badges.push(`

<span class="badge badge-featured">
⭐ 精選
</span>

`);

}


if (
    tool.new
) {

badges.push(`

<span class="badge badge-new">
🆕 最新
</span>

`);

}


if (
    tool.status ===
    "online"
) {

badges.push(`

<span class="badge badge-online">
🟢 線上
</span>

`);

}


const audience =
    Array.isArray(
        tool.audience
    )
        ? tool.audience
        : [];


const audienceText =
    audience
    .map(
        item =>
            item === "教師"
                ? "👨‍🏫 教師"
                : "👦 學生"
    )
    .join(" · ");


const tags =
    Array.isArray(
        tool.tags
    )
        ? tool.tags
        : [];


const tagsHTML =

tags.length

? `

<div class="tags">

${tags
.slice(0,4)
.map(
    tag =>
        `<span class="tag">
        #${tag}
        </span>`
)
.join("")
}

</div>

`

: "";


const isAvailable =

tool.url &&

tool.url !== "#" &&

!tool.url.includes(
    "請填入"
);


const actionHTML =

isAvailable

? `

<a
    class="tool-link"
    href="${tool.url}"
    target="_blank"
    rel="noopener noreferrer"
>
🚀 開始使用
</a>

`

: `

<span class="grade">
🚧 建置中
</span>

`;


return `

<article class="tool-card">


<div class="badges">

${badges.join("")}

</div>


<div class="tool-icon">

${tool.icon || "🤖"}

</div>


<div class="tool-category">

${tool.category || "其他"}

</div>


<div class="tool-name">

${tool.name || "未命名工具"}

</div>


<div class="tool-description">

${tool.description || ""}

</div>


${tagsHTML}


<div class="tool-footer">


<div class="tool-meta">


${
tool.grade

? `

<span class="grade">
🏫 ${tool.grade}
</span>

`

: ""

}


${
audienceText

? `

<span class="audience">
${audienceText}
</span>

`

: ""

}


</div>


${actionHTML}


</div>


</article>

`;

}



/* =================================
   顯示工具
================================= */

function renderTools() {


const container =
    document.getElementById(
        "toolsContainer"
    );


const filteredTools =
    getFilteredTools();


document.getElementById(
    "toolCount"
).textContent =

`共 ${filteredTools.length} 個工具`;


if (
    filteredTools.length === 0
) {

container.innerHTML = `

<div class="empty">

<div class="empty-icon">
🔍
</div>

<h3>
找不到符合的工具
</h3>

<p>
試試其他關鍵字、分類或篩選條件。
</p>

</div>

`;

return;

}


container.innerHTML =

filteredTools
.map(
    createToolCard
)
.join("");

}



/* =================================
   快速按鈕
================================= */

document
.querySelectorAll(
    ".quick-btn"
)
.forEach(
    button => {


button.addEventListener(
    "click",
    () => {


    currentFilter =
        button.dataset.filter;


    document
    .querySelectorAll(
        ".quick-btn"
    )
    .forEach(
        btn =>
            btn.classList
            .remove(
                "active"
            )
    );


    button.classList.add(
        "active"
    );


    renderTools();

    }
);

}
);



/* =================================
   搜尋
================================= */

document
.getElementById(
    "searchInput"
)
.addEventListener(
    "input",
    renderTools
);



/* =================================
   啟動
================================= */

loadTools();


</script>


</body>

</html>
