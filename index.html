<!DOCTYPE html>
<html lang="zh-Hant">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<title>民生國小 AI 教育工具中心</title>

<meta
    name="description"
    content="民生國小 AI 教育工具中心"
/>

<style>

* {
    box-sizing: border-box;
}

body {

    margin: 0;

    font-family:
        "Noto Sans TC",
        "Microsoft JhengHei",
        Arial,
        sans-serif;

    background:
        radial-gradient(
            circle at top left,
            #dbeafe,
            transparent 35%
        ),
        radial-gradient(
            circle at top right,
            #ede9fe,
            transparent 35%
        ),
        #f8fafc;

    color: #1e293b;

    min-height: 100vh;

}


/* =========================
   Header
========================= */

header {

    background:
        linear-gradient(
            135deg,
            #312e81,
            #4f46e5,
            #7c3aed
        );

    color: white;

    text-align: center;

    padding: 55px 20px 75px;

}

.hero {

    max-width: 900px;

    margin: auto;

}

.hero-icon {

    font-size: 60px;

}

.hero h1 {

    margin: 8px 0;

    font-size:
        clamp(
            32px,
            6vw,
            54px
        );

    font-weight: 900;

}

.hero p {

    margin: 12px 0;

    font-size: 19px;

    opacity: .9;

}

.hero-subtitle {

    font-size: 14px;

    opacity: .75;

}


/* =========================
   Main
========================= */

main {

    max-width: 1200px;

    margin:
        -35px auto 0;

    padding:
        0 20px 60px;

    position: relative;

}


/* =========================
   Search
========================= */

.search-box {

    background: white;

    border-radius: 20px;

    padding: 10px;

    display: flex;

    align-items: center;

    box-shadow:
        0 15px 40px
        rgba(
            15,
            23,
            42,
            .12
        );

}

.search-icon {

    font-size: 25px;

    margin:
        0 10px;

}

#searchInput {

    flex: 1;

    border: none;

    outline: none;

    font-size: 17px;

    padding: 15px;

}


/* =========================
   Main Tabs
========================= */

.main-tabs {

    display: grid;

    grid-template-columns:
        repeat(
            3,
            1fr
        );

    gap: 14px;

    margin:
        25px 0;

}

.main-tab {

    border: none;

    background: white;

    padding: 18px;

    border-radius: 16px;

    font-size: 17px;

    font-weight: 800;

    cursor: pointer;

    box-shadow:
        0 5px 18px
        rgba(
            15,
            23,
            42,
            .08
        );

    transition: .2s;

}

.main-tab:hover {

    transform:
        translateY(-2px);

}

.main-tab.active {

    background: #4f46e5;

    color: white;

}


/* =========================
   Filters
========================= */

.filters {

    display: flex;

    flex-wrap: wrap;

    gap: 10px;

    margin:
        20px 0;

}

.filter-group {

    display: flex;

    align-items: center;

    gap: 7px;

    flex-wrap: wrap;

}

.filter-label {

    font-size: 13px;

    font-weight: 800;

    color: #64748b;

}

.filter-btn {

    border: none;

    background: white;

    padding:
        8px 14px;

    border-radius: 999px;

    cursor: pointer;

    font-size: 13px;

    font-weight: 700;

}

.filter-btn.active {

    background: #6366f1;

    color: white;

}


/* =========================
   Section
========================= */

.section-title {

    display: flex;

    justify-content:
        space-between;

    align-items: center;

    margin:
        30px 0 18px;

}

.section-title h2 {

    margin: 0;

    font-size: 25px;

}

.tool-count {

    color: #64748b;

    font-size: 14px;

}


/* =========================
   Cards
========================= */

#toolsContainer {

    display: grid;

    grid-template-columns:
        repeat(
            auto-fit,
            minmax(
                260px,
                1fr
            )
        );

    gap: 20px;

}

.tool-card {

    background: white;

    border-radius: 22px;

    padding: 24px;

    border:
        1px solid
        #e2e8f0;

    box-shadow:
        0 8px 25px
        rgba(
            15,
            23,
            42,
            .08
        );

    display: flex;

    flex-direction: column;

    min-height: 250px;

    transition: .25s;

}

.tool-card:hover {

    transform:
        translateY(-5px);

    box-shadow:
        0 18px 40px
        rgba(
            15,
            23,
            42,
            .14
        );

}

.tool-icon {

    font-size: 45px;

    margin-bottom: 10px;

}

.tool-category {

    color: #6366f1;

    font-size: 13px;

    font-weight: 800;

}

.tool-name {

    font-size: 21px;

    font-weight: 900;

    margin:
        5px 0 10px;

}

.tool-description {

    color: #64748b;

    font-size: 14px;

    line-height: 1.6;

    flex: 1;

}

.tool-meta {

    display: flex;

    flex-wrap: wrap;

    gap: 6px;

    margin-top: 15px;

}

.tag {

    background: #f1f5f9;

    color: #475569;

    padding:
        5px 9px;

    border-radius: 8px;

    font-size: 11px;

}

.tool-footer {

    margin-top: 18px;

}

.tool-link {

    display: block;

    text-align: center;

    background: #4f46e5;

    color: white;

    text-decoration: none;

    padding: 10px;

    border-radius: 10px;

    font-weight: 800;

    font-size: 13px;

}

.tool-link:hover {

    background: #3730a3;

}


/* =========================
   Empty
========================= */

.empty {

    grid-column:
        1 / -1;

    text-align: center;

    padding: 70px 20px;

    color: #64748b;

}

.empty-icon {

    font-size: 55px;

}


/* =========================
   Admin Button
========================= */

.admin-button {

    position: fixed;

    right: 20px;

    bottom: 20px;

    border: none;

    background: #1e293b;

    color: white;

    padding:
        11px 16px;

    border-radius: 999px;

    cursor: pointer;

    font-weight: 700;

    box-shadow:
        0 8px 25px
        rgba(
            0,
            0,
            0,
            .2
        );

}


/* =========================
   Modal
========================= */

.modal {

    position: fixed;

    inset: 0;

    background:
        rgba(
            15,
            23,
            42,
            .55
        );

    display: none;

    align-items: center;

    justify-content: center;

    padding: 20px;

    z-index: 100;

}

.modal.show {

    display: flex;

}

.modal-box {

    background: white;

    width: 100%;

    max-width: 650px;

    max-height: 90vh;

    overflow-y: auto;

    border-radius: 22px;

    padding: 28px;

}

.modal-title {

    font-size: 24px;

    font-weight: 900;

    margin-bottom: 20px;

}

.form-group {

    margin-bottom: 15px;

}

.form-group label {

    display: block;

    font-size: 13px;

    font-weight: 800;

    margin-bottom: 6px;

}

.form-group input,
.form-group textarea,
.form-group select {

    width: 100%;

    border:
        1px solid
        #cbd5e1;

    border-radius: 10px;

    padding: 11px;

    font-size: 14px;

}

.form-group textarea {

    min-height: 90px;

    resize: vertical;

}

.radio-group {

    display: grid;

    grid-template-columns:
        repeat(
            3,
            1fr
        );

    gap: 8px;

}

.radio-option {

    border:
        1px solid
        #cbd5e1;

    padding: 12px;

    border-radius: 10px;

    cursor: pointer;

    text-align: center;

    font-weight: 700;

}

.radio-option input {

    display: none;

}

.radio-option:has(
    input:checked
) {

    background: #eef2ff;

    border-color: #6366f1;

    color: #4338ca;

}

.modal-actions {

    display: flex;

    gap: 10px;

    margin-top: 20px;

}

.primary-button,
.secondary-button,
.danger-button {

    flex: 1;

    border: none;

    padding: 12px;

    border-radius: 10px;

    cursor: pointer;

    font-weight: 800;

}

.primary-button {

    background: #4f46e5;

    color: white;

}

.secondary-button {

    background: #e2e8f0;

}

.danger-button {

    background: #dc2626;

    color: white;

}


/* =========================
   Admin List
========================= */

.admin-item {

    border:
        1px solid
        #e2e8f0;

    padding: 15px;

    border-radius: 14px;

    margin-bottom: 10px;

}

.admin-item-title {

    font-weight: 900;

}

.admin-item-meta {

    color: #64748b;

    font-size: 12px;

    margin-top: 5px;

}

.admin-item-actions {

    display: flex;

    gap: 8px;

    margin-top: 10px;

}

.admin-item-actions button {

    border: none;

    padding:
        7px 12px;

    border-radius: 8px;

    cursor: pointer;

    font-weight: 700;

}


/* =========================
   Toast
========================= */

.toast {

    position: fixed;

    left: 50%;

    bottom: 25px;

    transform:
        translateX(-50%)
        translateY(20px);

    background: #1e293b;

    color: white;

    padding:
        12px 20px;

    border-radius: 999px;

    opacity: 0;

    pointer-events: none;

    transition: .25s;

    z-index: 200;

}

.toast.show {

    opacity: 1;

    transform:
        translateX(-50%)
        translateY(0);

}


/* =========================
   Mobile
========================= */

@media (
    max-width: 650px
) {

    .main-tabs {

        grid-template-columns: 1fr;

    }

    .radio-group {

        grid-template-columns: 1fr;

    }

}

</style>

</head>


<body>


<header>

<div class="hero">

<div class="hero-icon">
🤖
</div>

<h1>
AI 教育工具中心
</h1>

<p>
AI × 教育 × 創意 × 學習
</p>

<div class="hero-subtitle">
民生國小 AI 教育工具平台
</div>

</div>

</header>


<main>


<div class="search-box">

<span class="search-icon">
🔎
</span>

<input
    id="searchInput"
    type="text"
    placeholder="搜尋工具、學科、年級、關鍵字……"
/>

</div>


<div class="main-tabs">

<button
    class="main-tab active"
    data-type="all"
>
全部工具
</button>

<button
    class="main-tab"
    data-type="student"
>
👨‍🎓 學生專區
</button>

<button
    class="main-tab"
    data-type="teacher"
>
👨‍🏫 教師專區
</button>

<button
    class="main-tab"
    data-type="tool"
>
💻 資訊工具
</button>

</div>


<div
    id="filters"
    class="filters"
></div>


<div class="section-title">

<h2 id="sectionTitle">
🧰 全部工具
</h2>

<span
    id="toolCount"
    class="tool-count"
>
載入中……
</span>

</div>


<div id="toolsContainer">

<div class="empty">

<div class="empty-icon">
⏳
</div>

正在載入工具……

</div>

</div>


</main>


<footer
    style="
        text-align:center;
        padding:30px;
        color:#64748b;
        font-size:13px;
    "
>

<strong>
民生國小 AI 教育工具中心
</strong>

<br>

AI × 教育 × 創意 × 未來

</footer>


<button
    class="admin-button"
    onclick="openLogin()"
>
🔐 管理
</button>


<!-- =========================
     Login
========================= -->

<div
    id="loginModal"
    class="modal"
>

<div class="modal-box">

<div class="modal-title">
🔐 管理員登入
</div>

<div class="form-group">

<label>
管理密碼
</label>

<input
    id="adminPassword"
    type="password"
    placeholder="請輸入管理密碼"
>

</div>

<div class="modal-actions">

<button
    class="secondary-button"
    onclick="closeModal('loginModal')"
>
取消
</button>

<button
    class="primary-button"
    onclick="loginAdmin()"
>
登入
</button>

</div>

</div>

</div>


<!-- =========================
     Admin
========================= -->

<div
    id="adminModal"
    class="modal"
>

<div class="modal-box">

<div class="modal-title">
🛠️ 工具管理
</div>

<button
    class="primary-button"
    onclick="openToolForm()"
>
＋ 新增工具
</button>

<div
    id="adminList"
    style="margin-top:20px;"
></div>

<div class="modal-actions">

<button
    class="secondary-button"
    onclick="closeModal('adminModal')"
>
關閉
</button>

</div>

</div>

</div>


<!-- =========================
     Tool Form
========================= -->

<div
    id="toolModal"
    class="modal"
>

<div class="modal-box">

<div
    id="toolModalTitle"
    class="modal-title"
>
➕ 新增工具
</div>


<div class="form-group">

<label>
網站名稱
</label>

<input
    id="formName"
    placeholder="例如：六上自然自主學習網站"
>

</div>


<div class="form-group">

<label>
網站網址
</label>

<input
    id="formUrl"
    placeholder="https://xxxxx.netlify.app/"
>

</div>


<div class="form-group">

<label>
使用專區
</label>

<div class="radio-group">

<label class="radio-option">

<input
    type="radio"
    name="formType"
    value="student"
    checked
    onchange="updateFormFields()"
>

👨‍🎓 學生專區

</label>


<label class="radio-option">

<input
    type="radio"
    name="formType"
    value="teacher"
    onchange="updateFormFields()"
>

👨‍🏫 教師專區

</label>


<label class="radio-option">

<input
    type="radio"
    name="formType"
    value="tool"
    onchange="updateFormFields()"
>

💻 資訊工具

</label>

</div>

</div>


<div
    id="categoryGroup"
    class="form-group"
>

<label id="categoryLabel">
學習領域
</label>

<select id="formCategory"></select>

</div>


<div
    id="stageGroup"
    class="form-group"
>

<label id="stageLabel">
學習階段
</label>

<select id="formStage">

<option value="">
請選擇
</option>

<option>
低年級
</option>

<option>
中年級
</option>

<option>
高年級
</option>

<option>
中高年級
</option>

</select>

</div>


<div class="form-group">

<label>
關鍵字
</label>

<input
    id="formKeywords"
    placeholder="例如：六年級,六上,預習,自主學習"
/>

<small
    style="
        color:#64748b;
        display:block;
        margin-top:5px;
    "
>
請用逗號分隔，例如：AI,課堂,互動
</small>

</div>


<div class="form-group">

<label>
圖示
</label>

<input
    id="formIcon"
    placeholder="例如：🔬"
>

</div>


<div class="form-group">

<label>
簡短介紹
</label>

<textarea
    id="formDescription"
    placeholder="簡單介紹這個工具的用途"
></textarea>

</div>


<div class="modal-actions">

<button
    class="secondary-button"
    onclick="closeModal('toolModal')"
>
取消
</button>

<button
    class="primary-button"
    onclick="saveTool()"
>
💾 儲存工具
</button>

</div>

</div>

</div>


<div
    id="toast"
    class="toast"
></div>


<script>


const API_URL =
    "/.netlify/functions/manage-tools";


let tools = [];

let currentType = "all";

let currentCategory = "全部";

let currentStage = "全部";

let adminPassword = "";

let editingId = null;


/* =========================
   工具資料
========================= */

async function loadTools() {

    try {

        const response =
            await fetch(API_URL);

        const data =
            await response.json();

        if (
            !response.ok ||
            !data.success
        ) {

            throw new Error(
                "無法取得工具資料"
            );

        }

        tools =
            data.tools || [];

        renderFilters();

        renderTools();

    }
    catch (error) {

        console.error(error);

        document
            .getElementById(
                "toolsContainer"
            )
            .innerHTML = `

                <div class="empty">

                    <div class="empty-icon">
                        ⚠️
                    </div>

                    <h3>
                        工具資料載入失敗
                    </h3>

                    <p>
                        請稍後再試。
                    </p>

                </div>
            `;

    }

}


/* =========================
   主分類
========================= */

document
    .querySelectorAll(".main-tab")
    .forEach(button => {

        button.addEventListener(
            "click",
            () => {

                document
                    .querySelectorAll(
                        ".main-tab"
                    )
                    .forEach(
                        btn =>
                            btn.classList
                                .remove(
                                    "active"
                                )
                    );

                button.classList
                    .add("active");

                currentType =
                    button.dataset.type;

                currentCategory =
                    "全部";

                currentStage =
                    "全部";

                renderFilters();

                renderTools();

            }
        );

    });


/* =========================
   篩選器
========================= */

function renderFilters() {

    const container =
        document.getElementById(
            "filters"
        );

    if (
        currentType ===
        "all"
    ) {

        container.innerHTML = "";

        return;

    }


    const typeTools =
        tools.filter(
            tool =>
                tool.type ===
                currentType
        );


    const categories = [

        "全部",

        ...new Set(

            typeTools

                .map(
                    tool =>
                        tool.category
                )

                .filter(Boolean)

        )

    ];


    const stages = [

        "全部",

        ...new Set(

            typeTools

                .map(
                    tool =>
                        tool.stage
                )

                .filter(Boolean)

        )

    ];


    let html = "";


    html += `

        <div class="filter-group">

            <span class="filter-label">

                ${
                    currentType ===
                    "student"

                    ? "學習領域"

                    : currentType ===
                    "teacher"

                    ? "教學領域"

                    : "工具類型"
                }

            </span>

    `;


    categories.forEach(
        category => {

            html += `

                <button
                    class="
                        filter-btn
                        ${
                            category ===
                            currentCategory
                            ? "active"
                            : ""
                        }
                    "
                    onclick="
                        selectCategory(
                            '${escapeJs(category)}'
                        )
                    "
                >
                    ${escapeHtml(category)}
                </button>

            `;

        }
    );


    html += `
        </div>
    `;


    if (
        currentType !==
        "tool"
    ) {

        html += `

            <div class="filter-group">

                <span class="filter-label">

                    ${
                        currentType ===
                        "student"

                        ? "學習階段"

                        : "適用年段"
                    }

                </span>

        `;


        stages.forEach(
            stage => {

                html += `

                    <button
                        class="
                            filter-btn
                            ${
                                stage ===
                                currentStage
                                ? "active"
                                : ""
                            }
                        "
                        onclick="
                            selectStage(
                                '${escapeJs(stage)}'
                            )
                        "
                    >
                        ${escapeHtml(stage)}
                    </button>

                `;

            }
        );


        html += `
            </div>
        `;

    }


    container.innerHTML =
        html;

}


function selectCategory(
    category
) {

    currentCategory =
        category;

    renderFilters();

    renderTools();

}


function selectStage(
    stage
) {

    currentStage =
        stage;

    renderFilters();

    renderTools();

}


/* =========================
   顯示工具
========================= */

function renderTools() {

    const keyword =
        document
            .getElementById(
                "searchInput"
            )
            .value
            .trim()
            .toLowerCase();


    const filtered =
        tools.filter(tool => {

            const typeMatch =
                currentType ===
                "all" ||
                tool.type ===
                currentType;


            const categoryMatch =
                currentCategory ===
                "全部" ||
                tool.category ===
                currentCategory;


            const stageMatch =
                currentType ===
                "tool" ||
                currentStage ===
                "全部" ||
                tool.stage ===
                currentStage;


            const searchText = [

                tool.name,

                tool.category,

                tool.stage,

                tool.description,

                ...(tool.keywords || [])

            ]
                .join(" ")
                .toLowerCase();


            const searchMatch =
                searchText.includes(
                    keyword
                );


            return (
                typeMatch &&
                categoryMatch &&
                stageMatch &&
                searchMatch
            );

        });


    const typeName = {

        all: "全部工具",

        student:
            "👨‍🎓 學生專區",

        teacher:
            "👨‍🏫 教師專區",

        tool:
            "💻 資訊工具"

    };


    document
        .getElementById(
            "sectionTitle"
        )
        .textContent =
            typeName[currentType];


    document
        .getElementById(
            "toolCount"
        )
        .textContent =
            `共 ${filtered.length} 個工具`;


    const container =
        document.getElementById(
            "toolsContainer"
        );


    if (
        filtered.length ===
        0
    ) {

        container.innerHTML = `

            <div class="empty">

                <div class="empty-icon">
                    🔍
                </div>

                <h3>
                    找不到符合的工具
                </h3>

                <p>
                    試試其他關鍵字或分類。
                </p>

            </div>

        `;

        return;

    }


    container.innerHTML =
        filtered
            .map(
                tool =>
                    createToolCard(
                        tool
                    )
            )
            .join("");

}


function createToolCard(
    tool
) {

    const tags =
        (tool.keywords || [])
            .slice(0, 5)
            .map(
                keyword =>
                    `<span class="tag">
                        #${escapeHtml(keyword)}
                    </span>`
            )
            .join("");


    return `

        <article
            class="tool-card"
        >

            <div class="tool-icon">
                ${escapeHtml(
                    tool.icon || "🧰"
                )}
            </div>

            <div class="tool-category">
                ${escapeHtml(
                    tool.category || ""
                )}
            </div>

            <div class="tool-name">
                ${escapeHtml(
                    tool.name
                )}
            </div>

            <div class="tool-description">
                ${escapeHtml(
                    tool.description || ""
                )}
            </div>

            <div class="tool-meta">

                ${
                    tool.stage
                    ? `
                        <span class="tag">
                            ${escapeHtml(
                                tool.stage
                            )}
                        </span>
                    `
                    : ""
                }

                ${tags}

            </div>

            <div class="tool-footer">

                <a
                    class="tool-link"
                    href="${escapeHtml(
                        tool.url
                    )}"
                    target="_blank"
                    rel="noopener noreferrer"
                >
                    🚀 開始使用
                </a>

            </div>

        </article>

    `;

}

document

/* =========================
   登入
========================= */

function openLogin() {

    document
        .getElementById(
            "loginModal"
        )
        .classList.add("show");

}


async function loginAdmin() {

    const password =
        document
            .getElementById(
                "adminPassword"
            )
            .value
            .trim();


    if (!password) {

        showToast(
            "請輸入管理密碼"
        );

        return;

    }


    try {

        const response =
            await fetch(
                API_URL,
                {

                    method: "POST",

                    headers: {

                        "Content-Type":
                            "application/json",

                        "X-Admin-Password":
                            password

                    },

                    body:
                        JSON.stringify({

                            action:
                                "login"

                        })

                }
            );


        const data =
            await response.json();


        if (
            !response.ok ||
            !data.success
        ) {

            throw new Error(
                data.message ||
                "登入失敗"
            );

        }


        adminPassword =
            password;


        closeModal(
            "loginModal"
        );


        document
            .getElementById(
                "adminPassword"
            )
            .value = "";


        openAdminPanel();

    }
    catch (error) {

        showToast(
            error.message
        );

    }

}


/* =========================
   管理面板
========================= */

async function openAdminPanel() {

    document
        .getElementById(
            "adminModal"
        )
        .classList.add("show");

    await loadAdminList();

}


async function loadAdminList() {

    const list =
        document.getElementById(
            "adminList"
        );


    list.innerHTML =
        "<p>載入中……</p>";


    try {

        const response =
            await fetch(
                API_URL
            );

        const data =
            await response.json();


        if (
            !response.ok ||
            !data.success
        ) {

            throw new Error(
                "讀取失敗"
            );

        }


        tools =
            data.tools || [];


        list.innerHTML =
            tools
                .map(
                    tool =>
                        `

                        <div class="admin-item">

                            <div
                                class="
                                    admin-item-title
                                "
                            >
                                ${
                                    escapeHtml(
                                        tool.icon || "🧰"
                                    )
                                }

                                ${
                                    escapeHtml(
                                        tool.name
                                    )
                                }

                            </div>

                            <div
                                class="
                                    admin-item-meta
                                "
                            >
                                ${
                                    escapeHtml(
                                        getTypeName(
                                            tool.type
                                        )
                                    )
                                }

                                ／

                                ${
                                    escapeHtml(
                                        tool.category || ""
                                    )
                                }

                                ${
                                    tool.stage
                                    ? `
                                        ／
                                        ${escapeHtml(
                                            tool.stage
                                        )}
                                    `
                                    : ""
                                }

                            </div>


                            <div
                                class="
                                    admin-item-actions
                                "
                            >

                                <button
                                    onclick="
                                        editTool(
                                            '${escapeJs(
                                                tool.id
                                            )}'
                                        )
                                    "
                                >
                                    ✏️ 編輯
                                </button>


                                <button
                                    onclick="
                                        deleteTool(
                                            '${escapeJs(
                                                tool.id
                                            )}'
                                        )
                                    "
                                    style="
                                        background:#fee2e2;
                                        color:#991b1b;
                                    "
                                >
                                    🗑️ 刪除
                                </button>

                            </div>

                        </div>

                    `
                )
                .join("");


    }
    catch (error) {

        list.innerHTML =
            `<p>${escapeHtml(
                error.message
            )}</p>`;

    }

}


/* =========================
   新增 / 編輯
========================= */

function openToolForm(
    id = null
) {

    editingId =
        id;


    document
        .getElementById(
            "toolModal"
        )
        .classList.add("show");


    if (id) {

        const tool =
            tools.find(
                item =>
                    String(
                        item.id
                    ) ===
                    String(id)
            );


        if (!tool) {

            showToast(
                "找不到工具"
            );

            return;

        }


        document
            .getElementById(
                "toolModalTitle"
            )
            .textContent =
                "✏️ 編輯工具";


        document
            .getElementById(
                "formName"
            )
            .value =
                tool.name || "";


        document
            .getElementById(
                "formUrl"
            )
            .value =
                tool.url || "";


        document
            .querySelector(
                `input[name="formType"][value="${tool.type}"]`
            )
            .checked = true;


        updateFormFields();


        document
            .getElementById(
                "formCategory"
            )
            .value =
                tool.category || "";


        document
            .getElementById(
                "formStage"
            )
            .value =
                tool.stage || "";


        document
            .getElementById(
                "formKeywords"
            )
            .value =
                (tool.keywords || [])
                    .join(",");


        document
            .getElementById(
                "formIcon"
            )
            .value =
                tool.icon || "";


        document
            .getElementById(
                "formDescription"
            )
            .value =
                tool.description || "";

    }
    else {

        document
            .getElementById(
                "toolModalTitle"
            )
            .textContent =
                "➕ 新增工具";


        clearToolForm();

        updateFormFields();

    }

}


function clearToolForm() {

    document
        .getElementById(
            "formName"
        )
        .value = "";


    document
        .getElementById(
            "formUrl"
        )
        .value = "";


    document
        .querySelector(
            'input[name="formType"][value="student"]'
        )
        .checked = true;


    document
        .getElementById(
            "formCategory"
        )
        .value = "";


    document
        .getElementById(
            "formStage"
        )
        .value = "";


    document
        .getElementById(
            "formKeywords"
        )
        .value = "";


    document
        .getElementById(
            "formIcon"
        )
        .value = "";


    document
        .getElementById(
            "formDescription"
        )
        .value = "";

}

            <option>數學</option>

            <option>自然</option>
            <option>社會</option>

    ) {

        categoryLabel.textContent =
            "教學領域";


        category.innerHTML = `

            <option value="">
                請選擇
            </option>

            <option>國語</option>
            <option>數學</option>
            <option>英語</option>
            <option>自然</option>
            <option>社會</option>
            <option>資訊</option>
            <option>課堂互動</option>
            <option>班級經營</option>
            <option>AI教學</option>
            <option>其他</option>

        `;


        stageGroup.style.display =
            "block";

    }
    else {

        categoryLabel.textContent =
            "工具類型";


        category.innerHTML = `

            <option value="">
                請選擇
            </option>

            <option>AI工具</option>
            <option>網頁工具</option>
            <option>檔案工具</option>
            <option>圖片工具</option>
            <option>文字工具</option>

        `;


        stageGroup.style.display =

        document
            .getElementById(
                "formStage"
            )
            .value = "";

}


/* =========================
   儲存
========================= */

async function saveTool() {

    const type =
        document
            .querySelector(
                'input[name="formType"]:checked'
            )
            .value;


    const tool = {

        name:
            document
                .getElementById(
                    "formName"
                )
                .value
                .trim(),

        url:
            document
                .getElementById(
                    "formUrl"
                )
                .value
                .trim(),

        type,

        category:
            document
                .getElementById(
                    "formCategory"
                )
                .value,

        stage:
            type === "tool"
                ? ""
                : document
                    .getElementById(
                        "formStage"
                    )
                    .value,

        keywords:
            document
                .getElementById(
                    "formKeywords"
                )
                .value
                .split(",")
                .map(
                    item =>
                        item.trim()
                )
                .filter(Boolean),

        icon:
            document
                .getElementById(
                    "formIcon"
                )
                .value
                .trim(),

        description:
            document
                .getElementById(
                    "formDescription"
                )
                .value
                .trim()

    };


    if (
        !tool.name ||
        !tool.url ||
        !tool.category ||
        !tool.icon ||
        !tool.description
    ) {

        showToast(
            "請完整填寫必要資料"
        );

        return;

    }


    try {

        const response =
            await fetch(
                API_URL,
                {

                    method:
                        editingId
                        ? "PUT"
                        : "POST",

                    headers: {

                        "Content-Type":
                            "application/json",

                        "X-Admin-Password":
                            adminPassword

                    },

                    body:
                        JSON.stringify(

                            editingId

                            ? {
                                id:
                                    editingId,
                                ...tool
                            }

                            : tool

                        )

                }
            );


        const data =
            await response.json();


        if (
            !response.ok ||
            !data.success
        ) {

            throw new Error(
                data.message ||
                "儲存失敗"
            );

        }


        closeModal(
            "toolModal"
        );


        showToast(
            editingId
            ? "✏️ 工具修改成功"
            : "🎉 工具新增成功"
        );


        editingId =
            null;


        await loadTools();

        await loadAdminList();

    }
    catch (error) {

        showToast(
            error.message
        );

    }

}


/* =========================
   編輯
========================= */

function editTool(id) {

    openToolForm(id);

}


/* =========================
   刪除
========================= */

async function deleteTool(
    id
) {

    const tool =
        tools.find(
            item =>
                String(
                    item.id
                ) ===
                String(id)
        );


    if (!tool) {

        return;

    }


    if (
        !confirm(
            `確定要刪除「${tool.name}」嗎？`
        )
    ) {

        return;

    }


    try {

        const response =
            await fetch(
                API_URL,
                {

                    method:
                        "DELETE",

                    headers: {

                        "Content-Type":
                            "application/json",

                        "X-Admin-Password":
                            adminPassword

                    },

                    body:
                        JSON.stringify({

                            id

                        })

                }
            );


        const data =
            await response.json();


        if (
            !response.ok ||
            !data.success
        ) {

            throw new Error(
                data.message ||
                "刪除失敗"
            );

        }


        showToast(
            "🗑️ 工具已刪除"
        );


        await loadTools();

        await loadAdminList();

    }
    catch (error) {

        showToast(
            error.message
        );

    }

}


/* =========================
   工具
========================= */

function getTypeName(
    type
) {

    const names = {

        student:
            "👨‍🎓 學生專區",

        teacher:
            "👨‍🏫 教師專區",

        tool:
            "💻 資訊工具"

    };


    return (
        names[type] ||
        type
    );

}


function closeModal(
    id
) {

    document
        .getElementById(id)
        .classList.remove(
            "show"
        );

}


function showToast(
    message
) {

    const toast =
        document.getElementById(
            "toast"
        );


    toast.textContent =
        message;


    toast.classList.add(
        "show"
    );


    setTimeout(
        () =>
            toast.classList.remove(
                "show"
            ),
        2500
    );

}


function escapeHtml(
    value
) {

    return String(
        value ?? ""
    )
        .replace(
            /&/g,
            "&amp;"
        )
        .replace(
            /</g,
            "&lt;"
        )
        .replace(
            />/g,
            "&gt;"
        )
        .replace(
            /"/g,
            "&quot;"
        )
        .replace(
            /'/g,
            "&#039;"
        );

}


function escapeJs(
    value
) {

    return String(
        value ?? ""
    )
        .replace(
            /\\/g,
            "\\\\"
        )
        .replace(
            /'/g,
            "\\'"
        )
        .replace(
            /\n/g,
            "\\n"
        )
        .replace(
            /\r/g,
            "\\r"
        );

}


/* =========================
   啟動
========================= */

loadTools();
